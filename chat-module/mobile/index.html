<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Pas de maximum-scale : le zoom d'accessibilité doit rester possible ;
     l'anti-débordement est géré par overflow-x:hidden + min-width:0 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Hnaya — Messagerie locale</title>
<style>
  :root { --bg:#0d1a12; --panel:#122419; --border:rgba(255,255,255,0.12); --text:#fff;
          --muted:rgba(255,255,255,0.5); --accent:#006341; --accent2:#00c853; --danger:#ff5252; }
  * { box-sizing:border-box; margin:0; padding:0; min-width:0; }
  /* ⚠️ 100dvh et NON 100% : sur mobile, 100% se calcule sur le GRAND
     viewport (celui qui inclut la zone masquée par la barre d'outils du
     navigateur). Le composeur se retrouvait alors sous le pli, hors de
     l'écran — retour terrain. 100dvh suit la hauteur réellement visible,
     barre repliée ou dépliée. Le 100vh reste en repli pour les
     navigateurs anciens. */
  html,body { height:100vh; height:100dvh; overflow:hidden; overscroll-behavior:none; }
  /* Retour de test terrain : la page paraissait « mode PC », trop petite.
     Base 16px minimum partout — jamais en dessous sur mobile. */
  body { background:var(--bg); color:var(--text); font-size:16px;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; }
  header { padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
           background:var(--panel); border-bottom:1px solid var(--border);
           display:flex; align-items:center; gap:12px; flex-shrink:0; }
  header .logo { width:34px; height:34px; border-radius:8px; background:var(--accent); flex-shrink:0;
                 display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
  header .title { font-size:17px; font-weight:700; flex:1; min-width:0; }
  header .title small { display:block; font-size:13px; font-weight:400; color:var(--muted);
                        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header select { background:var(--panel); color:var(--text); border:1px solid var(--border);
                  border-radius:8px; font-size:14px; padding:6px 8px; }
  main { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .screen { flex:1; min-height:0; display:none; flex-direction:column; overflow:hidden; }
  .screen.active { display:flex; }
  /* — Écran de connexion — */
  #join { justify-content:center; padding:24px; gap:16px; max-width:440px; width:100%;
          margin:0 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  /* Écran court (clavier ouvert, ou téléphone compact) : on récupère de la
     place sur les marges et l'en-tête SANS toucher aux tailles de texte —
     la lisibilité obtenue au test terrain précédent reste intacte. */
  @media (max-height:620px) {
    header { padding:8px 14px; }
    header .logo { width:28px; height:28px; font-size:16px; }
    #join { padding:14px 20px; gap:11px; justify-content:flex-start; }
    #join h1 { font-size:20px; }
    #messages { padding:10px 14px; gap:8px; }
    #composer { padding:9px 12px calc(9px + env(safe-area-inset-bottom)); }
  }
  #join h1 { font-size:22px; }
  #join p.sub { color:var(--muted); font-size:15px; line-height:1.5; }
  label { font-size:14px; color:var(--muted); display:block; margin-bottom:6px; }
  input { width:100%; padding:14px; border-radius:12px; border:1px solid var(--border);
          background:rgba(255,255,255,0.06); color:var(--text); font-size:17px; outline:none; }
  input:focus { border-color:var(--accent2); }
  #pin { letter-spacing:10px; text-align:center; font-size:26px; font-variant-numeric:tabular-nums; }
  button.primary { padding:15px; border-radius:12px; border:none; background:var(--accent); color:#fff;
                   font-size:17px; font-weight:700; cursor:pointer; }
  button.primary:disabled { opacity:.45; }
  .error { color:var(--danger); font-size:15px; min-height:20px; }
  .notice { font-size:13px; color:var(--muted); line-height:1.5; }
  /* — Écran de discussion — */
  #status { padding:8px 16px; font-size:14px; background:rgba(255,82,82,0.12); color:var(--danger);
            display:none; align-items:center; gap:8px; flex-shrink:0; }
  #status.show { display:flex; }
  #status button { margin-inline-start:auto; background:none; border:1px solid var(--danger);
                   color:var(--danger); border-radius:8px; padding:6px 14px; font-size:14px; cursor:pointer; }
  #messages { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:14px 16px;
              display:flex; flex-direction:column; gap:10px;
              -webkit-overflow-scrolling:touch; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; background:rgba(255,255,255,0.07);
         align-self:flex-start; font-size:16px; line-height:1.45; word-break:break-word;
         overflow-wrap:anywhere; }
  .msg.mine { background:var(--accent); align-self:flex-end; }
  .msg .from { font-size:13px; color:var(--accent2); font-weight:600; margin-bottom:2px; }
  .msg.mine .from { display:none; }
  .msg .time { font-size:12px; color:rgba(255,255,255,0.45); margin-top:4px; text-align:end; }
  .msg a { color:var(--accent2); word-break:break-all; direction:ltr; unicode-bidi:embed; }
  .msg.mine a { color:#fff; }
  #composer { display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
              background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; }
  #composer input { flex:1; }
  #composer button { padding:0 22px; border-radius:12px; border:none; background:var(--accent);
                     color:#fff; font-weight:700; cursor:pointer; font-size:16px; }
  #presence { font-size:13px; color:var(--accent2); }
  /* — Annuaire (étape F) — */
  header button.icon { background:transparent; border:1px solid var(--border); color:var(--text);
                       border-radius:8px; padding:7px 10px; font-size:14px; cursor:pointer;
                       flex-shrink:0; display:flex; align-items:center; gap:5px; }
  header button.icon.on { border-color:var(--accent2); color:var(--accent2); }
  .badge { background:var(--danger); color:#fff; border-radius:9px; min-width:18px; height:18px;
           font-size:11px; font-weight:700; display:inline-flex; align-items:center;
           justify-content:center; padding:0 5px; }
  #roster { flex:1; min-height:0; overflow-y:auto; padding:12px 14px; display:none;
            flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch; }
  #roster.show { display:flex; }
  .person { display:flex; align-items:center; gap:10px; width:100%; text-align:start;
            background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:12px;
            padding:12px 14px; color:var(--text); font-size:16px; cursor:pointer; }
  .person .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0;
                 background:rgba(255,255,255,0.25); }
  .person .dot.on { background:var(--accent2); }
  .person .who { flex:1; min-width:0; }
  .person .who b { display:block; font-size:16px; font-weight:600;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .person .who span { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
  .person .who span.role { color:var(--accent2); font-weight:600; }
  /* Bandeau du fil privé : on doit savoir à qui l'on écrit */
  #threadBar { display:none; align-items:center; gap:9px; flex-shrink:0;
               padding:9px 14px; background:rgba(0,200,83,0.10);
               border-bottom:1px solid var(--border); font-size:14px; }
  #threadBar.show { display:flex; }
  #threadBar button { background:transparent; border:none; color:var(--text);
                      font-size:20px; cursor:pointer; padding:0 4px; line-height:1; }
  #threadBar .peer { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #threadBar .tag { font-size:12px; color:var(--muted); flex-shrink:0; }
  /* — Pièces jointes (étape E) — */
  .msg img.thumb { max-width:100%; max-height:240px; border-radius:10px; display:block;
                   margin-top:6px; cursor:pointer; }
  .att { display:flex; align-items:center; gap:9px; margin-top:6px; padding:9px 11px;
         background:rgba(0,0,0,0.22); border-radius:10px; }
  .att .ico { font-size:20px; flex-shrink:0; }
  .att .meta { flex:1; min-width:0; font-size:14px; }
  .att .meta small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .att button { background:var(--accent); border:none; color:#fff; border-radius:9px;
                padding:8px 13px; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .msg audio { width:100%; min-width:200px; margin-top:6px; display:block; }
  /* — Envoi de pièces jointes — */
  #composer button.att-btn { padding:0 14px; background:transparent; border:1px solid var(--border);
                             color:var(--text); border-radius:12px; font-size:19px; flex-shrink:0; }
  #attPreview { display:none; align-items:center; gap:10px; padding:10px 14px;
                background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; }
  #attPreview.show { display:flex; }
  #attPreview img { width:44px; height:44px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  #attPreview .info { flex:1; min-width:0; font-size:14px; }
  #attPreview .info small { display:block; color:var(--muted); font-size:12px; margin-top:2px;
                            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #attPreview button { background:transparent; border:none; color:var(--muted);
                       font-size:22px; cursor:pointer; padding:0 6px; flex-shrink:0; }
  #attError { display:none; padding:8px 14px; font-size:13px; color:var(--danger);
              background:rgba(255,82,82,0.10); flex-shrink:0; line-height:1.45; }
  #attError.show { display:block; }
</style>
</head>
<body>
<header>
  <div class="logo">ح</div>
  <div class="title"><span data-i18n="appTitle">Messagerie locale</span>
    <small id="roomName"></small>
    <span id="presence"></span>
  </div>
  <!-- Annuaire : masqué tant qu'on n'a pas rejoint un salon -->
  <button id="rosterBtn" class="icon" style="display:none" aria-label="Annuaire">
    <span>👥</span><span id="rosterBadge"></span>
  </button>
  <select id="lang">
    <option value="ar">العربية</option>
    <option value="fr">Français</option>
    <option value="en">English</option>
  </select>
</header>
<main>
  <section id="join" class="screen active">
    <h1 data-i18n="joinTitle">Rejoindre le salon</h1>
    <p class="sub" data-i18n="joinSub">Communication chiffrée sur votre réseau interne — rien ne transite par Internet.</p>
    <div>
      <label data-i18n="nickname">Pseudo</label>
      <input id="nickname" maxlength="24" autocomplete="off">
    </div>
    <div>
      <label data-i18n="pinLabel">Code PIN (6 chiffres, communiqué par l'hôte)</label>
      <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
    </div>
    <div class="error" id="joinError"></div>
    <button class="primary" id="joinBtn" disabled data-i18n="joinBtn">Rejoindre</button>
    <p class="notice" data-i18n="notice">Gardez cette page ouverte pour recevoir les messages — les notifications d'écran verrouillé ne sont pas disponibles dans cette version.</p>
  </section>
  <section id="chat" class="screen">
    <div id="status"><span data-i18n="connectionLost">Connexion au salon perdue.</span>
      <button id="rejoinBtn" data-i18n="rejoin">Reconnecter</button></div>
    <!-- Fil privé en cours : à qui l'on écrit, et retour au salon -->
    <div id="threadBar">
      <button id="threadBack" aria-label="Retour">‹</button>
      <span class="peer" id="threadPeer"></span>
      <span class="tag" id="threadTag"></span>
    </div>
    <div id="roster"></div>
    <div id="messages"></div>
    <div id="attError"></div>
    <div id="attPreview">
      <img id="attThumb" alt="" style="display:none">
      <span id="attIcon" style="font-size:26px;display:none"></span>
      <span class="info"><span id="attName"></span><small id="attSize"></small></span>
      <button id="attCancel" aria-label="Retirer">✕</button>
    </div>
    <div id="composer">
      <!-- Photo, image ou document. `capture` fait proposer l'appareil
           photo sur téléphone, sans exiger de contexte sécurisé. -->
      <input type="file" id="fileInput" style="display:none"
             accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.odt,.ods,.txt,.csv,.zip">
      <!-- Vocal : on délègue au magnétophone du téléphone. getUserMedia
           est indisponible ici (page servie en http:// sur une IP privée,
           donc contexte non sécurisé) — voir le commentaire près de
           micSupporte dans le script. -->
      <input type="file" id="audioInput" style="display:none" accept="audio/*" capture>
      <button id="attBtn" class="att-btn" aria-label="Joindre">📎</button>
      <button id="micBtn" class="att-btn" aria-label="Vocal">🎤</button>
      <input id="draft" maxlength="2000" autocomplete="off">
      <button id="sendBtn" data-i18n="send">Envoyer</button>
    </div>
  </section>
</main>
<script type="module">
import { deriveKeyFromPin, encryptPayload, decryptPayload, generateIdentity, identityFromPrivate } from "./vendor/crypto-bundle.js";

// ── Identité d'appareil Ed25519 (étape D) ──────────────────────────────
// Générée à la première visite, conservée en localStorage : le pseudo est
// libre mais chaque message est signé — l'admin du salon peut toujours
// rattacher un message à ce téléphone (voir src/identity.js).
// La clé privée ne quitte JAMAIS l'appareil.
const identity = (() => {
  try {
    const saved = localStorage.getItem("hnaya-chat-device-key");
    if (saved) return identityFromPrivate(saved);
  } catch { /* clé corrompue → on régénère */ }
  const fresh = generateIdentity();
  localStorage.setItem("hnaya-chat-device-key", fresh.privateKeyB64);
  return fresh;
})();

// crypto.randomUUID est réservé aux contextes sécurisés (indisponible en
// http:// LAN) — getRandomValues reste disponible partout.
function genMsgId() {
  const b = crypto.getRandomValues(new Uint8Array(16));
  return "msg_" + Array.from(b).map((x) => x.toString(16).padStart(2, "0")).join("");
}

// ── i18n ──────────────────────────────────────────────────────
const I18N = {
  fr: { appTitle:"Messagerie locale", joinTitle:"Rejoindre le salon", joinSub:"Communication chiffrée sur votre réseau interne — rien ne transite par Internet.", nickname:"Pseudo", pinLabel:"Code PIN (6 chiffres, communiqué par l'hôte)", joinBtn:"Rejoindre", notice:"Gardez cette page ouverte pour recevoir les messages — les notifications d'écran verrouillé ne sont pas disponibles dans cette version.", connectionLost:"Connexion au salon perdue.", rejoin:"Reconnecter", send:"Envoyer", wrongPin:"PIN incorrect — vérifiez le code auprès de l'hôte.", cantReach:"Salon injoignable — vérifiez que vous êtes sur le même wifi.", online:"en ligne", draftPlaceholder:"Écrire un message…", connecting:"Connexion…",
        rosterTitle:"Annuaire", rosterEmpty:"Personne d'autre n'a encore rejoint ce salon.", rosterMe:"vous", rosterUnnamed:"Sans nom", rosterOnline:"En ligne", rosterJustNow:"à l'instant", threadPrivate:"Privé", threadEmpty:"Aucun message dans cette conversation privée.", roomThread:"Salon",
        attVoice:"Message vocal", attFile:"Pièce jointe", attSave:"Ouvrir", attLoading:"Chargement…", attGone:"Pièce jointe indisponible.", attFailed:"Échec du téléchargement.",
        attSending:"Envoi…", attTooBig:"Fichier trop volumineux (25 Mo maximum).", attTypeRefused:"Ce type de fichier n'est pas autorisé.", attQuotaBytes:"Limite de volume atteinte pour cet appareil (200 Mo par heure).", attQuotaFiles:"Trop de fichiers envoyés depuis cet appareil dans la dernière heure.", attBusy:"Trop d'envois simultanés — patientez.", attSendFailed:"L'envoi de la pièce jointe a échoué.", attImageFailed:"Cette image n'a pas pu être lue. Son extension annonce un format que son contenu ne respecte pas — cas fréquent des photos d'iPhone enregistrées en « .jpg » alors qu'elles sont au format HEIC.", attCaption:"Ajouter un mot (facultatif)…" },
  en: { appTitle:"Local Messaging", joinTitle:"Join the room", joinSub:"Encrypted communication over your internal network — nothing goes through the Internet.", nickname:"Nickname", pinLabel:"PIN code (6 digits, provided by the host)", joinBtn:"Join", notice:"Keep this page open to receive messages — lock-screen notifications are not available in this version.", connectionLost:"Connection to the room lost.", rejoin:"Reconnect", send:"Send", wrongPin:"Incorrect PIN — check the code with the host.", cantReach:"Room unreachable — make sure you are on the same wifi.", online:"online", draftPlaceholder:"Write a message…", connecting:"Connecting…",
        rosterTitle:"Directory", rosterEmpty:"Nobody else has joined this room yet.", rosterMe:"you", rosterUnnamed:"Unnamed", rosterOnline:"Online", rosterJustNow:"just now", threadPrivate:"Private", threadEmpty:"No messages in this private conversation yet.", roomThread:"Room",
        attVoice:"Voice message", attFile:"Attachment", attSave:"Open", attLoading:"Loading…", attGone:"Attachment unavailable.", attFailed:"Download failed.",
        attSending:"Sending…", attTooBig:"File too large (25 MB maximum).", attTypeRefused:"This file type is not allowed.", attQuotaBytes:"Upload limit reached for this device (200 MB per hour).", attQuotaFiles:"Too many files sent from this device in the past hour.", attBusy:"Too many uploads at once — please wait.", attSendFailed:"Sending the attachment failed.", attImageFailed:"This image could not be read. Its extension claims a format its contents do not match — commonly an iPhone photo saved as “.jpg” while actually being HEIC.", attCaption:"Add a note (optional)…" },
  ar: { appTitle:"المراسلة المحلية", joinTitle:"الانضمام إلى الغرفة", joinSub:"تواصل مشفّر عبر شبكتك الداخلية — لا شيء يمر عبر الإنترنت.", nickname:"الاسم المستعار", pinLabel:"رمز PIN (6 أرقام، يقدّمه المضيف)", joinBtn:"انضمام", notice:"أبقِ هذه الصفحة مفتوحة لاستقبال الرسائل — إشعارات شاشة القفل غير متاحة في هذا الإصدار.", connectionLost:"انقطع الاتصال بالغرفة.", rejoin:"إعادة الاتصال", send:"إرسال", wrongPin:"رمز PIN غير صحيح — تحقّق من الرمز لدى المضيف.", cantReach:"تعذّر الوصول إلى الغرفة — تأكّد أنك على نفس شبكة الواي فاي.", online:"متصل", draftPlaceholder:"اكتب رسالة…", connecting:"جارٍ الاتصال…",
        rosterTitle:"الدليل", rosterEmpty:"لم ينضم أحد آخر إلى هذه الغرفة بعد.", rosterMe:"أنت", rosterUnnamed:"بلا اسم", rosterOnline:"متصل", rosterJustNow:"الآن", threadPrivate:"خاص", threadEmpty:"لا توجد رسائل في هذه المحادثة الخاصة.", roomThread:"الغرفة",
        attVoice:"رسالة صوتية", attFile:"مرفق", attSave:"فتح", attLoading:"جارٍ التحميل…", attGone:"المرفق غير متاح.", attFailed:"فشل التحميل.",
        attSending:"جارٍ الإرسال…", attTooBig:"الملف كبير جداً (25 ميغابايت كحد أقصى).", attTypeRefused:"هذا النوع من الملفات غير مسموح به.", attQuotaBytes:"بلغ هذا الجهاز حدّ الحجم المسموح (200 ميغابايت في الساعة).", attQuotaFiles:"أُرسلت ملفات كثيرة من هذا الجهاز خلال الساعة الأخيرة.", attBusy:"عمليات إرسال كثيرة في آن واحد — انتظر قليلاً.", attSendFailed:"فشل إرسال المرفق.", attImageFailed:"تعذّرت قراءة هذه الصورة. امتدادها يعلن صيغة لا يطابقها محتواها — وهي حالة شائعة في صور آيفون المحفوظة بامتداد «.jpg» بينما هي بصيغة HEIC.", attCaption:"أضف كلمة (اختياري)…" },
};
let lang = localStorage.getItem("hnaya-mobile-lang")
  || (navigator.language || "fr").slice(0, 2);
if (!I18N[lang]) lang = "fr";
const t = (k) => I18N[lang][k] || I18N.fr[k] || k;
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  draft.placeholder = t("draftPlaceholder");
  langSel.value = lang;
}

// ── Références DOM ────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const joinScreen = $("join"), chatScreen = $("chat"), joinBtn = $("joinBtn"),
  nicknameInput = $("nickname"), pinInput = $("pin"), joinError = $("joinError"),
  messagesEl = $("messages"), draft = $("draft"), sendBtn = $("sendBtn"),
  statusBar = $("status"), rejoinBtn = $("rejoinBtn"), presenceEl = $("presence"),
  roomNameEl = $("roomName"), langSel = $("lang"),
  rosterBtn = $("rosterBtn"), rosterBadge = $("rosterBadge"), rosterEl = $("roster"),
  threadBar = $("threadBar"), threadBack = $("threadBack"),
  threadPeerEl = $("threadPeer"), threadTagEl = $("threadTag");

langSel.onchange = () => { lang = langSel.value; localStorage.setItem("hnaya-mobile-lang", lang); applyLang(); };
// « Ajouter mon mobile » : le QR peut transporter le pseudo du poste qui
// invite (paramètre ?u=). Le téléphone rejoint alors sous LA MÊME
// identité, sans que l'utilisateur ait à retaper — ou à inventer — un
// second pseudo. Le PIN, lui, n'est JAMAIS mis dans l'URL : un QR
// photographié par-dessus l'épaule donnerait l'accès au salon.
const paramsUrl = new URLSearchParams(location.search);
const pseudoInvite = (paramsUrl.get("u") || "").slice(0, 24).trim();
nicknameInput.value = pseudoInvite || localStorage.getItem("hnaya-chat-nickname") || "";
if (pseudoInvite) {
  // Le champ PIN prend le focus : c'est la seule chose qui reste à saisir.
  setTimeout(() => { try { pinInput.focus(); } catch { /* champ absent */ } }, 250);
}
applyLang();

// Nom du salon + port WS — servis par l'hôte
let wsPort = 4802;
fetch("/info.json").then(r => r.json()).then(info => {
  wsPort = info.wsPort || 4802;
  roomNameEl.textContent = info.sessionName || "";
}).catch(() => {});

const validate = () => { joinBtn.disabled = !(nicknameInput.value.trim() && /^\d{6}$/.test(pinInput.value)); };
nicknameInput.oninput = validate; pinInput.oninput = validate;

// ── Connexion au salon (même protocole que les postes) ────────
let ws = null, key = null, userId = "", lastSeenTs = 0, joined = false;
const seenIds = new Set(); // dédoublonnage backlog/reconnexion (règle du module)

function showStatus(show) { statusBar.classList.toggle("show", show); }

// Liens cliquables : découpage texte/URL en éléments DOM (jamais
// d'innerHTML avec du contenu reçu — le texte reste inerte).
// ⚠️ Détecte aussi les liens sans schéma (www.hnaya.dz, hnaya.dz/…) —
// même regex que MessageText dans components/ChatPanel.tsx : les deux
// côtés doivent linkifier à l'identique.
const URL_SPLIT = /((?:https?:\/\/|www\.)[^\s]+|(?:[a-zA-Z0-9-]+\.)+(?:dz|com|net|org|fr|io)(?:\/[^\s]*)?)/g;
const isLinkPart = (p) => /^(?:https?:\/\/|www\.|(?:[a-zA-Z0-9-]+\.)+(?:dz|com|net|org|fr|io)(?:\/|$))/.test(p);
function renderText(container, text) {
  String(text).split(URL_SPLIT).forEach((part) => {
    if (isLinkPart(part)) {
      const a = document.createElement("a");
      a.href = /^https?:\/\//.test(part) ? part : "https://" + part;
      a.textContent = part;
      a.target = "_blank"; a.rel = "noopener noreferrer";
      container.appendChild(a);
    } else if (part) {
      container.appendChild(document.createTextNode(part));
    }
  });
}

// ── Étape F — fils de discussion ──────────────────────────────
// Les messages sont CONSERVÉS puis filtrés à l'affichage : le salon et
// chaque conversation privée ont leur propre fil, comme sur les postes.
let allMessages = [];
let activeThread = "all";
let myFp = null;         // notre empreinte, donnée par l'annuaire
let people = [];         // annuaire du salon
let peerOfThread = null; // personne du fil privé ouvert
const unread = {};       // non-lus par fil privé

// Même règle que chat-module/src/direct.js : empreintes TRIÉES, sinon les
// deux côtés ouvriraient deux fils distincts pour la même paire.
const threadIdFor = (a, b) => "dm:" + [String(a).toLowerCase(), String(b).toLowerCase()].sort().join("+");

const humanSize = (n) => n < 1024 * 1024
  ? Math.max(1, Math.round(n / 1024)) + " Ko"
  : (n / 1024 / 1024).toFixed(1) + " Mo";

// ── Pièce jointe : la vignette est DANS le message (affichage immédiat),
// le fichier complet n'est demandé qu'au clic. Voir src/media.js.
const pendingMedia = new Map(); // sha256 -> { chunks, resolve, reject }

function fetchMedia(sha256, mime) {
  return new Promise((resolve, reject) => {
    if (!ws || ws.readyState !== 1) { reject(new Error("offline")); return; }
    // Un seul téléchargement en vol par fichier : deux clics rapides ne
    // doivent pas ouvrir deux flux concurrents pour les mêmes octets.
    const enCours = pendingMedia.get(sha256);
    if (enCours) { enCours.waiters.push({ resolve, reject }); return; }
    pendingMedia.set(sha256, { chunks: [], waiters: [{ resolve, reject }] });
    ws.send(encryptPayload(key, { v: 1, type: "media-get", sha256, mime }));
  });
}

function renderMedia(div, m) {
  const md = m.media;
  if (!md) return;
  if (md.kind === "image" && md.thumb) {
    const img = document.createElement("img");
    img.className = "thumb"; img.src = md.thumb; img.alt = "";
    img.onclick = async () => {
      try {
        const buf = await fetchMedia(md.sha256, md.mime);
        const url = URL.createObjectURL(new Blob([buf], { type: md.mime }));
        window.open(url, "_blank");
      } catch { img.insertAdjacentText("afterend", t("attFailed")); }
    };
    div.appendChild(img);
    return;
  }
  const box = document.createElement("div"); box.className = "att";
  const ico = document.createElement("span"); ico.className = "ico";
  ico.textContent = md.kind === "voice" ? "🎤" : "📄";
  const meta = document.createElement("div"); meta.className = "meta";
  const titre = document.createElement("span");
  titre.textContent = md.kind === "voice" ? t("attVoice") : (md.name || t("attFile"));
  const sub = document.createElement("small");
  sub.textContent = md.kind === "voice" && md.duration
    ? Math.floor(md.duration / 60) + ":" + String(md.duration % 60).padStart(2, "0")
    : humanSize(md.size || 0);
  meta.append(titre, sub);
  const btn = document.createElement("button"); btn.textContent = t("attSave");
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = t("attLoading");
    try {
      const buf = await fetchMedia(md.sha256, md.mime);
      const url = URL.createObjectURL(new Blob([buf], { type: md.mime }));
      if (md.kind === "voice") {
        // Lecteur en place : sur téléphone, ouvrir un onglet pour un
        // vocal de trois secondes serait absurde.
        const audio = document.createElement("audio");
        audio.controls = true; audio.src = url;
        box.replaceWith(audio);
      } else {
        const a = document.createElement("a");
        a.href = url; a.download = md.name || "hnaya-fichier";
        document.body.appendChild(a); a.click(); a.remove();
        btn.disabled = false; btn.textContent = t("attSave");
      }
    } catch (e) {
      btn.disabled = false;
      btn.textContent = e && e.message === "gone" ? t("attGone") : t("attFailed");
    }
  };
  box.append(ico, meta, btn);
  div.appendChild(box);
}

function messageNode(m) {
  const div = document.createElement("div");
  div.className = "msg" + (m.from === userId ? " mine" : "");
  const from = document.createElement("div"); from.className = "from"; from.textContent = m.from || "";
  div.appendChild(from);
  // Texte facultatif : un vocal ou une image peut partir sans un mot.
  if (m.text) { const text = document.createElement("div"); renderText(text, m.text); div.appendChild(text); }
  renderMedia(div, m);
  const time = document.createElement("div"); time.className = "time";
  time.textContent = m.ts ? new Date(m.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
  div.appendChild(time);
  return div;
}

function renderMessages() {
  messagesEl.textContent = "";
  const duFil = allMessages.filter((m) => (m.groupId || "all") === activeThread);
  if (!duFil.length) {
    const vide = document.createElement("div");
    vide.style.cssText = "text-align:center;color:var(--muted);font-size:14px;padding:20px 0";
    vide.textContent = activeThread === "all" ? "" : t("threadEmpty");
    messagesEl.appendChild(vide);
    return;
  }
  duFil.forEach((m) => messagesEl.appendChild(messageNode(m)));
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(m) {
  if (m.id && seenIds.has(m.id)) return;
  if (m.id) seenIds.add(m.id);
  if (m.ts) lastSeenTs = Math.max(lastSeenTs, m.ts);
  allMessages.push(m);
  const fil = m.groupId || "all";
  if (fil !== activeThread && fil.startsWith("dm:") && m.from !== userId) {
    unread[fil] = (unread[fil] || 0) + 1;
    renderBadge();
  }
  if (fil === activeThread) {
    // Rendu incrémental : reconstruire tout le fil à chaque message
    // ferait sauter le défilement en pleine lecture.
    if (messagesEl.firstChild && !messagesEl.querySelector(".msg")) messagesEl.textContent = "";
    messagesEl.appendChild(messageNode(m));
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

function renderBadge() {
  const total = Object.values(unread).reduce((a, b) => a + b, 0);
  rosterBadge.className = total ? "badge" : "";
  rosterBadge.textContent = total ? String(total) : "";
}

// ── Annuaire ──────────────────────────────────────────────────
const depuis = (ts) => {
  if (!ts) return "";
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return t("rosterJustNow");
  if (min < 60) return min + " min";
  const h = Math.floor(min / 60);
  return h < 24 ? h + " h" : Math.floor(h / 24) + " j";
};

function renderRoster() {
  rosterEl.textContent = "";
  const tri = [...people].sort((a, b) => {
    if (a.isMe !== b.isMe) return a.isMe ? 1 : -1;
    if (a.online !== b.online) return a.online ? -1 : 1;
    return (a.name || "").localeCompare(b.name || "");
  });
  if (!tri.length) {
    const vide = document.createElement("div");
    vide.style.cssText = "color:var(--muted);font-size:14px;text-align:center;padding:20px 0;line-height:1.6";
    vide.textContent = t("rosterEmpty");
    rosterEl.appendChild(vide);
    return;
  }
  tri.forEach((p) => {
    const b = document.createElement("button");
    b.className = "person";
    const dot = document.createElement("span");
    dot.className = "dot" + (p.online ? " on" : "");
    const who = document.createElement("span"); who.className = "who";
    const nom = document.createElement("b");
    nom.textContent = (p.name || t("rosterUnnamed")) + (p.isMe ? " · " + t("rosterMe") : "");
    const sous = document.createElement("span");
    if (p.role) { sous.className = "role"; sous.textContent = p.role; }
    else sous.textContent = p.online ? t("rosterOnline") : depuis(p.lastSeen);
    who.append(nom, sous);
    b.append(dot, who);
    const fil = myFp && !p.isMe ? threadIdFor(myFp, p.fingerprint) : null;
    if (fil && unread[fil]) {
      const bg = document.createElement("span"); bg.className = "badge";
      bg.textContent = String(unread[fil]); b.appendChild(bg);
    }
    if (fil) b.onclick = () => openThread(fil, p);
    else b.disabled = true;
    rosterEl.appendChild(b);
  });
}

function openThread(fil, personne) {
  activeThread = fil;
  peerOfThread = personne;
  unread[fil] = 0; renderBadge();
  threadPeerEl.textContent = (personne.name || t("rosterUnnamed")) + (personne.role ? " · " + personne.role : "");
  threadTagEl.textContent = t("threadPrivate");
  threadBar.classList.add("show");
  showRoster(false);
  renderMessages();
}

function backToRoom() {
  activeThread = "all"; peerOfThread = null;
  threadBar.classList.remove("show");
  renderMessages();
}

function showRoster(on) {
  rosterEl.classList.toggle("show", on);
  messagesEl.style.display = on ? "none" : "flex";
  document.getElementById("composer").style.display = on ? "none" : "flex";
  rosterBtn.classList.toggle("on", on);
  if (on) requestRoster();
}

function requestRoster() {
  if (ws && ws.readyState === 1) ws.send(encryptPayload(key, { v: 1, type: "roster" }));
}

rosterBtn.onclick = () => showRoster(!rosterEl.classList.contains("show"));
threadBack.onclick = backToRoom;

// ══════════════════════════════════════════════════════════════
// Envoi de pièces jointes (étape E, côté mobile)
// ══════════════════════════════════════════════════════════════
// ⚠️ LE MICROPHONE EST HORS D'ATTEINTE ICI. La page est servie en http://
// sur une IP privée : aucun certificat TLS n'est possible, donc le
// contexte n'est PAS sécurisé et navigator.mediaDevices est indisponible
// (même cause que crypto.subtle, d'où la crypto embarquée). On délègue
// donc l'enregistrement au magnétophone du téléphone via un champ
// fichier `capture` — qui, lui, ne demande aucun contexte sécurisé.
const micSupporte = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

const fileInput = $("fileInput"), audioInput = $("audioInput"),
  attBtn = $("attBtn"), micBtn = $("micBtn"), attPreview = $("attPreview"),
  attThumb = $("attThumb"), attIcon = $("attIcon"), attName = $("attName"),
  attSize = $("attSize"), attCancel = $("attCancel"), attError = $("attError");

let pendingAtt = null;          // pièce jointe préparée, en attente d'envoi
const pendingUploads = new Map(); // uploadId -> { resolve, reject, bytes }

function showAttError(msg) {
  attError.textContent = msg || "";
  attError.classList.toggle("show", !!msg);
}

// Base64 par tranches : String.fromCharCode sur 25 Mo d'un coup ferait
// déborder la pile d'appels.
function toBase64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 8192) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  }
  return btoa(bin);
}

// Une photo de téléphone fait 3 à 8 Mo ; réduite à 1600 px et réencodée
// en JPEG elle tombe sous le mégaoctet, sans différence visible.
const IMG_MAX = 1600, IMG_Q = 0.82, THUMB_MAX = 220, THUMB_Q = 0.6;

function dessiner(img, maxSide, quality) {
  const ratio = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * ratio));
  const h = Math.max(1, Math.round(img.naturalHeight * ratio));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  return { dataUrl: c.toDataURL("image/jpeg", quality), w, h };
}

// L'hôte refuse toute vignette de plus de 24 Ko (MAX_THUMB_BYTES dans
// src/media.js), et elle voyage en base64 — donc gonflée d'un tiers. Une
// photo carrée très détaillée frôle déjà ce plafond : la marge est trop
// mince pour un appareil photo de téléphone, qui produit exactement ce
// genre d'image. On redescend la qualité tant qu'il le faut plutôt que
// de laisser l'envoi entier être refusé.
const THUMB_MAX_OCTETS = 24 * 1024;
function vignetteSousPlafond(img) {
  let out = dessiner(img, THUMB_MAX, THUMB_Q);
  for (const q of [0.45, 0.32, 0.2]) {
    if (out.dataUrl.length <= THUMB_MAX_OCTETS) break;
    out = dessiner(img, THUMB_MAX, q);
  }
  // Dernier recours : réduire aussi les dimensions. Une vignette laide
  // vaut mieux qu'une pièce jointe refusée.
  if (out.dataUrl.length > THUMB_MAX_OCTETS) out = dessiner(img, 140, 0.4);
  return out;
}

function dataUrlEnOctets(dataUrl) {
  const bin = atob(dataUrl.split(",")[1] || "");
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function preparer(file, forcerVocal) {
  if (file.type.startsWith("image/")) {
    const img = await new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const i = new Image();
      i.onload = () => { URL.revokeObjectURL(url); res(i); };
      i.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
      i.src = url;
    });
    const plein = dessiner(img, IMG_MAX, IMG_Q);
    const vignette = vignetteSousPlafond(img);
    const bytes = dataUrlEnOctets(plein.dataUrl);
    return {
      kind: "image", mime: "image/jpeg", bytes, thumb: vignette.dataUrl,
      w: plein.w, h: plein.h, preview: vignette.dataUrl,
      // Le nom doit décrire les octets réellement envoyés : on recompresse
      // toujours en JPEG (voir suggestedFilename dans src/media.js).
      name: file.name.replace(/\.[^.\/\\]{1,8}$/, "") + ".jpg",
    };
  }
  const bytes = new Uint8Array(await file.arrayBuffer());
  const estAudio = forcerVocal || file.type.startsWith("audio/");
  return {
    kind: estAudio ? "voice" : "file",
    mime: file.type || "application/octet-stream",
    bytes, thumb: null, name: file.name || null, preview: null,
  };
}

function afficherApercu(att) {
  if (att.preview) {
    attThumb.src = att.preview; attThumb.style.display = "";
    attIcon.style.display = "none";
  } else {
    attThumb.style.display = "none";
    attIcon.textContent = att.kind === "voice" ? "🎤" : "📄";
    attIcon.style.display = "";
  }
  attName.textContent = att.kind === "voice" ? t("attVoice") : (att.name || t("attFile"));
  attSize.textContent = humanSize(att.bytes.length);
  attPreview.classList.add("show");
  draft.placeholder = t("attCaption");
}

function annulerApercu() {
  pendingAtt = null;
  attPreview.classList.remove("show");
  showAttError("");
  draft.placeholder = t("draftPlaceholder");
}

async function choisir(e, forcerVocal) {
  const file = e.target.files && e.target.files[0];
  e.target.value = ""; // permet de reprendre le même fichier
  if (!file) return;
  showAttError("");
  try {
    pendingAtt = await preparer(file, forcerVocal);
    afficherApercu(pendingAtt);
  } catch (e) {
    // Une image indécodable méritait mieux qu'un « échec » muet : le
    // navigateur déduit le type de l'EXTENSION, pas du contenu, donc une
    // photo HEIC enregistrée « .jpg » est annoncée image/jpeg puis refuse
    // de s'ouvrir. Sans ce message, personne ne peut le deviner.
    showAttError(t(e && e.message === "image" ? "attImageFailed" : "attSendFailed"));
  }
}

attBtn.onclick = () => fileInput.click();
micBtn.onclick = () => audioInput.click();
fileInput.onchange = (e) => choisir(e, false);
audioInput.onchange = (e) => choisir(e, true);
attCancel.onclick = annulerApercu;

/** Téléverse chez l'hôte, morceau par morceau, puis rend l'empreinte
 *  CALCULÉE PAR L'HÔTE — c'est elle qui scellera la signature. */
function televerser(att) {
  return new Promise((resolve, reject) => {
    if (!ws || ws.readyState !== 1) { reject(new Error("offline")); return; }
    const b = crypto.getRandomValues(new Uint8Array(8));
    const uploadId = "up_" + Array.from(b).map((x) => x.toString(16).padStart(2, "0")).join("");
    pendingUploads.set(uploadId, { resolve, reject, bytes: att.bytes });
    ws.send(encryptPayload(key, {
      v: 1, type: "media-begin", uploadId,
      kind: att.kind, mime: att.mime, size: att.bytes.length, thumb: att.thumb,
    }));
  });
}

// L'envoi effectif attend le feu vert de l'hôte : inutile d'expédier des
// mégaoctets qu'il refusera (type interdit, quota, taille).
function envoyerMorceaux(uploadId) {
  const en = pendingUploads.get(uploadId);
  if (!en) return;
  const CHUNK = 64 * 1024;
  for (let off = 0, seq = 0; off < en.bytes.length; off += CHUNK, seq++) {
    ws.send(encryptPayload(key, {
      v: 1, type: "media-chunk", uploadId, seq,
      data: toBase64(en.bytes.subarray(off, Math.min(off + CHUNK, en.bytes.length))),
    }));
  }
  ws.send(encryptPayload(key, { v: 1, type: "media-end", uploadId }));
}

const MSG_ERREUR = {
  size: "attTooBig", mime: "attTypeRefused", busy: "attBusy",
  "quota-bytes": "attQuotaBytes", "quota-files": "attQuotaFiles",
};

async function connect() {
  joinError.textContent = "";
  joinBtn.disabled = true; joinBtn.textContent = t("connecting");
  userId = nicknameInput.value.trim();
  localStorage.setItem("hnaya-chat-nickname", userId);
  key = await deriveKeyFromPin(pinInput.value);

  ws = new WebSocket(`ws://${location.hostname}:${wsPort}`);
  let gotBacklog = false;

  // Sans backlog dans les 12 s → échec (PIN silencieusement faux ou réseau) —
  // même garde-fou de délai que le dock des postes
  const timeout = setTimeout(() => { if (!gotBacklog) { try { ws.close(); } catch {} fail(t("cantReach")); } }, 12000);
  const fail = (msg) => {
    clearTimeout(timeout);
    joinBtn.textContent = t("joinBtn"); validate();
    if (!joined) { joinError.textContent = msg; }
    else showStatus(true);
  };

  ws.onopen = () => {
    ws.send(encryptPayload(key, {
      v: 2,
      type: "join",
      userId,
      groups: ["all"],
      lastSeenTs,
      device: {
        publicKey: identity.publicKeySpki,
        hostname: null, // pas de nom de machine exposé par un navigateur
        platform: "mobile-web (" + ((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "?") + ")",
      },
    }));
  };
  ws.onmessage = (ev) => {
    let payload;
    try { payload = decryptPayload(key, ev.data); } catch { return; }
    if (payload.type === "backlog") {
      gotBacklog = true; clearTimeout(timeout);
      if (!joined) {
        joined = true;
        joinScreen.classList.remove("active"); chatScreen.classList.add("active");
        rosterBtn.style.display = "flex";
      }
      showStatus(false);
      payload.messages.forEach(addMessage);
      renderMessages();
      // L'annuaire donne notre propre empreinte : sans elle, impossible
      // de composer l'identifiant d'un fil privé.
      requestRoster();
    } else if (payload.type === "message") addMessage(payload);
    else if (payload.type === "presence") {
      presenceEl.textContent = `● ${payload.online.length} ${t("online")}`;
      // La présence a changé : l'annuaire affiché doit suivre, sinon la
      // pastille verte ment jusqu'au prochain aller-retour.
      if (rosterEl.classList.contains("show")) requestRoster();
    }
    // ── Étape F — annuaire ──
    else if (payload.type === "roster") {
      people = payload.people || [];
      myFp = payload.me || myFp;
      renderRoster();
    }
    // ── Étape E — téléversement en cours ──
    else if (payload.type === "media-go") {
      envoyerMorceaux(payload.uploadId);
    } else if (payload.type === "media-ready") {
      const u = pendingUploads.get(payload.uploadId);
      pendingUploads.delete(payload.uploadId);
      if (u) u.resolve({ sha256: payload.sha256, size: payload.size });
    } else if (payload.type === "media-failed") {
      const u = pendingUploads.get(payload.uploadId);
      pendingUploads.delete(payload.uploadId);
      if (u) u.reject(new Error(payload.reason || "media"));
    }
    // ── Étape E — pièces jointes reçues par morceaux ──
    else if (payload.type === "media-data") {
      const p = pendingMedia.get(payload.sha256);
      if (p) p.chunks.push(payload.data);
    } else if (payload.type === "media-done") {
      const p = pendingMedia.get(payload.sha256);
      pendingMedia.delete(payload.sha256);
      if (p) {
        // ⚠️ Décoder CHAQUE morceau séparément, jamais la concaténation
        // des chaînes base64 : un morceau de 64 Kio n'est pas un multiple
        // de 3 octets, son encodage se termine donc par du remplissage
        // « = ». Coller ces chaînes produit un base64 invalide et atob
        // renvoie des octets faux (ou lève).
        const parts = p.chunks.map((b64) => {
          const bin = atob(b64);
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          return arr;
        });
        const total = parts.reduce((n, a) => n + a.length, 0);
        const buf = new Uint8Array(total);
        let off = 0;
        for (const a of parts) { buf.set(a, off); off += a.length; }
        p.waiters.forEach((w) => w.resolve(buf));
      }
    } else if (payload.type === "media-error") {
      const p = pendingMedia.get(payload.sha256);
      pendingMedia.delete(payload.sha256);
      if (p) p.waiters.forEach((w) => w.reject(new Error(payload.reason || "media")));
    }
  };
  ws.onclose = (ev) => {
    // 4001 = l'hôte n'a pas pu déchiffrer notre "join" → PIN incorrect
    if (ev.code === 4001) fail(t("wrongPin"));
    else fail(t("connectionLost"));
    presenceEl.textContent = "";
  };
  ws.onerror = () => { /* onclose suit toujours — géré là-bas */ };
}

joinBtn.onclick = connect;
rejoinBtn.onclick = () => { showStatus(false); connect(); };

// Retour sur la page (téléphone déverrouillé, onglet réactivé) : si la
// connexion est morte pendant la veille, reconnexion automatique — le
// backlog + lastSeenTs récupèrent les messages manqués
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && joined && (!ws || ws.readyState > 1)) connect();
});

function emettre(text, media) {
  // Protocole v2 : id + horodatage générés ici puis SIGNÉS — même contrat
  // que le client de bureau (src/client.js), vérifié par le serveur.
  const core = { id: genMsgId(), from: userId, text, ts: Date.now() };
  // La pièce jointe entre dans le périmètre signé (5e élément du noyau,
  // voir src/identity.js) : elle ne peut plus être substituée après coup.
  if (media && media.sha256) core.mediaSha = String(media.sha256);
  ws.send(encryptPayload(key, {
    v: 2,
    type: "message",
    id: core.id,
    text: core.text,
    ts: core.ts,
    // Le message part dans le fil OUVERT : le salon, ou la conversation
    // privée en cours. Codé en dur, une réponse privée serait partie dans
    // le salon, au vu de tous.
    groupId: activeThread,
    media: media || null,
    signature: identity.signMessage(core),
  }));
}

async function sendDraft() {
  const text = draft.value.trim();
  // Connexion tombée : le dire. Un retour silencieux laissait l'utilisateur
  // cliquer « Envoyer » sans que rien ne se passe ni ne s'explique.
  if (!ws || ws.readyState !== 1) {
    showStatus(true);
    if (pendingAtt) showAttError(t("connectionLost"));
    return;
  }
  // Un vocal ou une photo peut partir SANS texte — d'où la condition sur
  // l'un ou l'autre.
  if (!text && !pendingAtt) return;

  if (!pendingAtt) { emettre(text, null); draft.value = ""; return; }

  const att = pendingAtt;
  sendBtn.disabled = true;
  const libelle = sendBtn.textContent;
  sendBtn.textContent = t("attSending");
  showAttError("");
  try {
    // Le fichier monte D'ABORD chez l'hôte ; le message ne part qu'ensuite,
    // avec l'empreinte que l'hôte a calculée sur les octets reçus.
    const res = await televerser(att);
    const media = {
      kind: att.kind, mime: att.mime, sha256: res.sha256, size: res.size,
      thumb: att.thumb, name: att.name,
    };
    if (att.kind === "image") { media.w = att.w; media.h = att.h; }
    emettre(text, media);
    draft.value = "";
    annulerApercu();
  } catch (e) {
    const cle = MSG_ERREUR[e && e.message] || "attSendFailed";
    showAttError(t(cle));
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = libelle;
  }
}
sendBtn.onclick = sendDraft;
draft.addEventListener("keydown", (e) => { if (e.key === "Enter") sendDraft(); });
</script>
</body>
</html>
