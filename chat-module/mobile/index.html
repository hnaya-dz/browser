<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Pas de maximum-scale : le zoom d'accessibilité doit rester possible ;
     l'anti-débordement est géré par overflow-x:hidden + min-width:0 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Hnaya — Messagerie locale</title>
<style>
  :root { --bg:#0d1a12; --panel:#122419; --border:rgba(255,255,255,0.12); --text:#fff;
          --muted:rgba(255,255,255,0.5); --accent:#006341; --accent2:#00c853; --danger:#ff5252; }
  * { box-sizing:border-box; margin:0; padding:0; min-width:0; }
  /* ⚠️ 100dvh et NON 100% : sur mobile, 100% se calcule sur le GRAND
     viewport (celui qui inclut la zone masquée par la barre d'outils du
     navigateur). Le composeur se retrouvait alors sous le pli, hors de
     l'écran — retour terrain. 100dvh suit la hauteur réellement visible,
     barre repliée ou dépliée. Le 100vh reste en repli pour les
     navigateurs anciens. */
  html,body { height:100vh; height:100dvh; overflow:hidden; overscroll-behavior:none; }
  /* Retour de test terrain : la page paraissait « mode PC », trop petite.
     Base 16px minimum partout — jamais en dessous sur mobile. */
  body { background:var(--bg); color:var(--text); font-size:16px;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; }
  header { padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
           background:var(--panel); border-bottom:1px solid var(--border);
           display:flex; align-items:center; gap:12px; flex-shrink:0; }
  header .logo { width:34px; height:34px; border-radius:8px; background:var(--accent); flex-shrink:0;
                 display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
  header .title { font-size:17px; font-weight:700; flex:1; min-width:0; }
  header .title small { display:block; font-size:13px; font-weight:400; color:var(--muted);
                        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header select { background:var(--panel); color:var(--text); border:1px solid var(--border);
                  border-radius:8px; font-size:15px; padding:6px 8px; min-height:44px; }
  main { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .screen { flex:1; min-height:0; display:none; flex-direction:column; overflow:hidden; }
  .screen.active { display:flex; }
  /* — Écran de connexion — */
  #join { justify-content:center; padding:24px; gap:16px; max-width:440px; width:100%;
          margin:0 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  /* Écran court (clavier ouvert, ou téléphone compact) : on récupère de la
     place sur les marges et l'en-tête SANS toucher aux tailles de texte —
     la lisibilité obtenue au test terrain précédent reste intacte. */
  @media (max-height:620px) {
    header { padding:8px 14px; }
    header .logo { width:28px; height:28px; font-size:16px; }
    #join { padding:14px 20px; gap:11px; justify-content:flex-start; }
    #join h1 { font-size:20px; }
    #messages { padding:10px 14px; gap:8px; }
    #composer { padding:9px 12px calc(9px + env(safe-area-inset-bottom)); }
  }
  #join h1 { font-size:22px; }
  #join p.sub { color:var(--muted); font-size:15px; line-height:1.5; }
  label { font-size:14px; color:var(--muted); display:block; margin-bottom:6px; }
  input { width:100%; padding:14px; border-radius:12px; border:1px solid var(--border);
          background:rgba(255,255,255,0.06); color:var(--text); font-size:17px; outline:none; }
  input:focus { border-color:var(--accent2); }
  /* ⚠️ Une liste déroulante ne s'habille PAS toute seule.
     Laissée nue, elle garde l'apparence native du système : minuscule,
     sur fond BLANC, au milieu de champs sombres pleine largeur — et sous
     Windows, le texte clair du thème la rendait carrément illisible (déjà
     constaté sur les listes du poste). Elle reprend donc trait pour trait
     le style des champs de saisie ; le fond des OPTIONS est posé à part,
     car le système dessine la liste ouverte lui-même.
     ⚠️ On NE met PAS `appearance:none` : cela retire le chevron, et le
     champ devient indiscernable d'une saisie libre — rien n'indique plus
     qu'il y a un choix à faire. L'apparence native est conservée, comme
     pour la liste de langue de l'en-tête, qui le prouve depuis le début. */
  #roomPick { width:100%; padding:14px; border-radius:12px; border:1px solid var(--border);
              background:rgba(255,255,255,0.06); color:var(--text); font-size:17px; outline:none; }
  #roomPick:focus { border-color:var(--accent2); }
  #roomPick option { background:var(--panel); color:var(--text); }
  #pin { letter-spacing:10px; text-align:center; font-size:26px; font-variant-numeric:tabular-nums; }
  button.primary { padding:15px; border-radius:12px; border:none; background:var(--accent); color:#fff;
                   font-size:17px; font-weight:700; cursor:pointer; }
  button.primary:disabled { opacity:.45; }
  .error { color:var(--danger); font-size:15px; min-height:20px; }
  .notice { font-size:13px; color:var(--muted); line-height:1.5; }
  /* — Écran de discussion — */
  #status { padding:8px 16px; font-size:14px; background:rgba(255,82,82,0.12); color:var(--danger);
            display:none; align-items:center; gap:8px; flex-shrink:0; }
  #status.show { display:flex; }
  #status button { margin-inline-start:auto; background:none; border:1px solid var(--danger);
                   color:var(--danger); border-radius:8px; padding:6px 14px; font-size:14px; cursor:pointer; }
  #messages { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:14px 16px;
              display:flex; flex-direction:column; gap:10px;
              -webkit-overflow-scrolling:touch; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; background:rgba(255,255,255,0.07);
         align-self:flex-start; font-size:16px; line-height:1.45; word-break:break-word;
         overflow-wrap:anywhere; }
  .msg.mine { background:var(--accent); align-self:flex-end; }
  .msg .from { font-size:13px; color:var(--accent2); font-weight:600; margin-bottom:2px; }
  .msg.mine .from { display:none; }
  .msg .time { font-size:12px; color:rgba(255,255,255,0.45); margin-top:4px; text-align:end; }
  .msg a { color:var(--accent2); word-break:break-all; direction:ltr; unicode-bidi:embed; }
  .msg.mine a { color:#fff; }
  #composer { display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
              background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; }
  /* ⚠️ Sur un écran de 375 px, les trois boutons ne laissaient que 99 px
     au champ de saisie : on écrivait un message dans une fente. C'est ce
     qui donnait l'impression d'une barre d'outils de bureau posée sur un
     téléphone. Le champ passe donc en premier servi (flex + min-width),
     et les boutons prennent une largeur fixe, juste au-dessus du seuil
     tactile de 44 px. Mesuré : le champ repasse de 99 à ~150 px. */
  #composer input { flex:1 1 auto; min-width:120px; }
  #composer button { padding:0 16px; border-radius:12px; border:none; background:var(--accent);
                     color:#fff; font-weight:700; cursor:pointer; font-size:16px;
                     min-height:46px; flex-shrink:0; }
  #presence { font-size:13px; color:var(--accent2); }
  /* État vide : centré dans la hauteur restante. En portrait, un texte
     collé en haut d'un grand vide donne l'impression d'une page cassée. */
  .empty { flex:1; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:6px; text-align:center; padding:24px; }
  .empty-t { font-size:16px; color:var(--muted); }
  .empty-s { font-size:14px; color:rgba(255,255,255,0.35); line-height:1.5; max-width:280px; }
  /* — Étape G : citation — */
  .quote { border-inline-start:3px solid var(--accent2); padding-inline-start:8px;
           margin-bottom:5px; opacity:.8; cursor:pointer; }
  .quote-who { font-size:12px; color:var(--accent2); font-weight:600; }
  .quote-txt { font-size:13px; color:rgba(255,255,255,0.65); overflow:hidden;
               text-overflow:ellipsis; white-space:nowrap; }
  /* Un téléphone n'a pas de survol : le bouton Répondre est TOUJOURS
     visible, et assez grand pour le doigt. */
  .reply-btn { margin-top:6px; background:transparent; border:1px solid var(--border);
               color:var(--muted); border-radius:9px; font-size:13px; cursor:pointer;
               min-height:44px; padding:0 14px; }
  #replyBar { display:none; align-items:center; gap:10px; padding:10px 14px;
              background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; }
  #replyBar.show { display:flex; }
  #replyBar .info { flex:1; min-width:0; font-size:14px; }
  #replyBar .info small { display:block; color:var(--muted); font-size:12px;
                          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #replyBar button { background:transparent; border:none; color:var(--muted); font-size:22px;
                     cursor:pointer; flex-shrink:0; min-width:44px; min-height:44px;
                     display:flex; align-items:center; justify-content:center; }
  /* — Étape P : réunion annoncée — */
  .reunion { align-self:stretch; border-radius:14px; padding:12px 14px;
             background:rgba(0,99,65,0.16); border:1px solid rgba(0,200,83,0.4); }
  .reunion.proche { background:rgba(0,200,83,0.20); border-color:rgba(0,200,83,0.75); }
  .reunion-tete { display:flex; align-items:center; gap:6px; font-size:15px; }
  .reunion-tete b { flex:1; min-width:0; }
  .reunion-compte { font-size:12px; font-weight:700; color:var(--accent2); flex-shrink:0; }
  .reunion-quand { font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.5; }
  .reunion-txt { font-size:14px; margin-top:6px; line-height:1.5; }
  .reunion-bas { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .reunion-bas span { flex:1; min-width:0; font-size:12px; color:var(--muted); }
  .reunion-bas button { min-height:44px; padding:8px 12px; border-radius:10px;
                        border:1px solid var(--border); background:transparent;
                        color:var(--fg); font-size:13px; cursor:pointer; flex-shrink:0; }
  /* — Étape N : accusé de lecture — */
  .vu { font-size:11.5px; color:var(--muted); margin-top:3px; text-align:end; }
  /* — Étape M : pastille d'identité et photo de profil — */
  .ma-photo { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .ma-photo button { min-height:44px; padding:8px 12px; border-radius:10px;
                     border:1px solid var(--border); background:transparent;
                     color:var(--fg); font-size:13px; cursor:pointer; }
  .ma-photo button.lien { border:none; color:var(--muted); text-decoration:underline;
                          padding:8px 6px; }
  .avatar img { display:block; }
  .avatar { position:relative; flex-shrink:0; width:36px; height:36px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-size:14px; font-weight:700; user-select:none; }
  .avatar::after { content:""; position:absolute; right:-1px; bottom:-1px;
                   width:11px; height:11px; border-radius:50%;
                   background:#6b6b6b; border:2px solid var(--panel); }
  .avatar.on::after { background:#00c853; }
  /* — Étape K : qualifier l'envoi — */
  #tagBar { display:flex; flex-direction:column; gap:6px; padding:8px 12px 0; flex-shrink:0; }
  .tag-choix { display:flex; gap:5px; flex-wrap:wrap; }
  .tag-choix button { flex:1 1 auto; min-height:36px; padding:5px 8px; font-size:12px;
                      border-radius:9px; border:1px solid var(--border);
                      background:transparent; color:var(--muted); cursor:pointer; }
  #tagDest { width:100%; min-height:40px; padding:6px 8px; font-size:13px;
             border-radius:9px; border:1px solid var(--border);
             background:var(--panel); color:var(--fg); }
  /* ⚠️ Les options d'une liste déroulante sont dessinées par le système,
     souvent sur fond blanc, en héritant de la couleur de texte du thème
     sombre : texte blanc sur blanc, liste illisible. Constaté sur le
     poste ; on pose les couleurs en dur ici aussi. */
  #tagDest option { background:var(--panel); color:var(--fg); }
  #tagDest[hidden] { display:none; }
  /* — Étape K : demande qualifiée — */
  .demande { border:1px solid; border-radius:10px; padding:8px 10px; margin-bottom:6px; }
  .demande-tete { font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; }
  .demande-vers { color:var(--muted); font-weight:400; text-transform:none; letter-spacing:0; }
  .demande-issue { font-size:12.5px; line-height:1.5; color:var(--muted); margin-top:4px; }
  .demande-com { font-style:italic; padding-inline-start:10px; }
  .demande-att { font-size:12px; color:var(--muted); margin-top:3px; }
  .demande-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .demande-actions button { flex:1 1 30%; min-height:44px; min-width:88px; padding:6px 8px;
                            font-size:13px; font-weight:600; border-radius:9px;
                            border:1px solid var(--border); background:transparent;
                            color:var(--fg); cursor:pointer; }
  /* — Étape J : messages privés en attente — */
  #priveBar { display:flex; flex-direction:column; gap:6px; padding:9px 12px; flex-shrink:0;
              border-top:1px solid rgba(255,82,82,0.45); background:rgba(255,82,82,0.13); }
  #priveBar[hidden] { display:none; }
  #priveBar button { display:flex; align-items:center; gap:9px; width:100%;
                     min-height:44px; padding:8px 10px; border-radius:10px;
                     border:1px solid rgba(255,82,82,0.5); background:rgba(255,82,82,0.10);
                     color:var(--fg); font-size:14px; text-align:start; cursor:pointer; }
  #priveBar .qui { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #priveBar .n { flex-shrink:0; min-width:20px; height:20px; padding:0 6px; border-radius:10px;
                 background:#ff5252; color:#fff; font-size:11px; font-weight:700;
                 display:flex; align-items:center; justify-content:center; }
  /* — Étape I : échéance de licence — */
  #licenceBar { padding:10px 14px; font-size:12.5px; line-height:1.45; flex-shrink:0;
                border-top:1px solid rgba(255,180,60,0.30); color:#ffcf8a;
                background:rgba(255,180,60,0.10); }
  #licenceBar[hidden] { display:none; }
  #licenceBar.stop { color:#ff9d9d; background:rgba(255,80,80,0.10);
                     border-top-color:rgba(255,80,80,0.35); }
  /* — Étape H : vote — */
  .vote { align-self:stretch; background:rgba(0,99,65,0.16); border:1px solid rgba(0,200,83,0.4);
          border-radius:14px; padding:12px 14px; }
  .vote-head { font-size:12px; color:var(--accent2); font-weight:700; letter-spacing:.4px;
               display:flex; align-items:center; gap:6px; margin-bottom:3px; }
  .vote-tag { font-size:11px; color:var(--muted); border:1px solid var(--border);
              border-radius:4px; padding:1px 5px; font-weight:400; letter-spacing:0; }
  .vote-q { font-size:16px; font-weight:600; margin-bottom:9px; line-height:1.4; }
  /* 46px : au-dessus du seuil tactile, comme les boutons du composeur. */
  .vote-opt { display:flex; align-items:center; gap:8px; width:100%; min-height:46px;
              background:rgba(255,255,255,0.06); border:1px solid var(--border);
              border-radius:10px; color:var(--text); font-size:15px; padding:0 12px;
              margin-bottom:6px; cursor:pointer; text-align:start; }
  .vote-opt:disabled { opacity:.55; cursor:default; }
  .vote-n { font-variant-numeric:tabular-nums; color:var(--muted); }
  .vote-who { font-size:12px; color:var(--muted); padding-inline-start:10px; margin:-3px 0 6px; }
  .vote-foot { font-size:12px; color:var(--muted); margin-top:4px; }
  /* — Annuaire (étape F) — */
  /* 44 px minimum : ce bouton n'apparaît qu'une fois connecté, il avait
     donc échappé au premier passage sur les cibles tactiles. */
  header button.icon { background:transparent; border:1px solid var(--border); color:var(--text);
                       border-radius:8px; padding:7px 10px; font-size:14px; cursor:pointer;
                       flex-shrink:0; display:flex; align-items:center; justify-content:center;
                       gap:5px; min-height:44px; }
  header button.icon.on { border-color:var(--accent2); color:var(--accent2); }
  .badge { background:var(--danger); color:#fff; border-radius:9px; min-width:18px; height:18px;
           font-size:11px; font-weight:700; display:inline-flex; align-items:center;
           justify-content:center; padding:0 5px; }
  #roster { flex:1; min-height:0; overflow-y:auto; padding:12px 14px; display:none;
            flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch; }
  #roster.show { display:flex; }
  .person { display:flex; align-items:center; gap:10px; width:100%; text-align:start;
            background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:12px;
            padding:12px 14px; color:var(--text); font-size:16px; cursor:pointer; }
  .person .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0;
                 background:rgba(255,255,255,0.25); }
  .person .dot.on { background:var(--accent2); }
  .person .who { flex:1; min-width:0; }
  .person .who b { display:block; font-size:16px; font-weight:600;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .person .who span { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
  .person .who span.role { color:var(--accent2); font-weight:600; }
  /* Bandeau du fil privé : on doit savoir à qui l'on écrit */
  #threadBar { display:none; align-items:center; gap:9px; flex-shrink:0;
               padding:9px 14px; background:rgba(0,200,83,0.10);
               border-bottom:1px solid var(--border); font-size:14px; }
  #threadBar.show { display:flex; }
  /* ⚠️ 44×44 minimum : ce retour ne faisait que 15×20 px, mesuré sur la
     page réelle. Au doigt, c'est presque impossible à viser — et c'est le
     seul moyen de sortir d'un fil privé. La zone tactile est agrandie
     sans grossir le chevron. */
  #threadBar button { background:transparent; border:none; color:var(--text);
                      font-size:22px; cursor:pointer; line-height:1;
                      min-width:44px; min-height:44px; margin-inline-start:-10px;
                      display:flex; align-items:center; justify-content:center; }
  #threadBar .peer { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #threadBar .tag { font-size:12px; color:var(--muted); flex-shrink:0; }
  /* — Pièces jointes (étape E) — */
  .msg img.thumb { max-width:100%; max-height:240px; border-radius:10px; display:block;
                   margin-top:6px; cursor:pointer; }
  .att { display:flex; align-items:center; gap:9px; margin-top:6px; padding:9px 11px;
         background:rgba(0,0,0,0.22); border-radius:10px; }
  .att .ico { font-size:20px; flex-shrink:0; }
  .att .meta { flex:1; min-width:0; font-size:14px; }
  .att .meta small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .att button { background:var(--accent); border:none; color:#fff; border-radius:9px;
                padding:8px 13px; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .msg audio { width:100%; min-width:200px; margin-top:6px; display:block; }
  /* — Envoi de pièces jointes — */
  /* Carrés de 46 px : assez larges au doigt, sans voler la place du champ
     (ils faisaient 55 px chacun, soit 110 px pris à la saisie). */
  #composer button.att-btn { padding:0; width:46px; background:transparent; border:1px solid var(--border);
                             color:var(--text); border-radius:12px; font-size:19px; flex-shrink:0;
                             display:flex; align-items:center; justify-content:center; }
  #attPreview { display:none; align-items:center; gap:10px; padding:10px 14px;
                background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; }
  #attPreview.show { display:flex; flex-wrap:wrap; }
  /* Le lecteur d'un vocal prend sa propre ligne : comprimé entre l'icône
     et la croix, il serait inutilisable au pouce. */
  #attAudio { flex:1 0 100%; width:100%; height:36px; margin-top:2px; }
  #attAudio[hidden] { display:none; }
  #attPreview img { width:44px; height:44px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  #attPreview .info { flex:1; min-width:0; font-size:14px; }
  #attPreview .info small { display:block; color:var(--muted); font-size:12px; margin-top:2px;
                            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 44×44 au doigt : ce « retirer » ne faisait que 30×29 px. */
  #attPreview button { background:transparent; border:none; color:var(--muted);
                       font-size:22px; cursor:pointer; flex-shrink:0;
                       min-width:44px; min-height:44px;
                       display:flex; align-items:center; justify-content:center; }
  #attError { display:none; padding:8px 14px; font-size:13px; color:var(--danger);
              background:rgba(255,82,82,0.10); flex-shrink:0; line-height:1.45; }
  #attError.show { display:block; }
</style>
</head>
<body>
<header>
  <div class="logo">ح</div>
  <div class="title"><span data-i18n="appTitle">Messagerie locale</span>
    <small id="roomName"></small>
    <span id="presence"></span>
  </div>
  <!-- Annuaire : masqué tant qu'on n'a pas rejoint un salon -->
  <button id="rosterBtn" class="icon" style="display:none" aria-label="Annuaire">
    <span>👥</span><span id="rosterBadge"></span>
  </button>
  <!-- Étape J — signal sonore, activable. Masqué avant la connexion :

const paramsUrl = new URLSearchParams(location.search);

const URL_SPLIT = /((?:https?:\/\/|www\.)[^\s]+|(?:[a-zA-Z0-9-]+\.)+(?:dz|com|net|org|fr|io)(?:\/[^\s]*)?)/g;
const isLinkPart = (p) => /^(?:https?:\/\/|www\.|(?:[a-zA-Z0-9-]+\.)+(?:dz|com|net|org|fr|io)(?:\/|$))/.test(p);
function renderText(container, text) {
  String(text).split(URL_SPLIT).forEach((part) => {
    if (isLinkPart(part)) {
      const a = document.createElement("a");
      a.href = /^https?:\/\//.test(part) ? part : "https://" + part;
      a.textContent = part;
      a.target = "_blank"; a.rel = "noopener noreferrer";
      container.appendChild(a);
    } else if (part) {
      container.appendChild(document.createTextNode(part));

  });

let people = [];         // annuaire du salon
let peerOfThread = null; // personne du fil privé ouvert
const unread = {};       // non-lus par fil privé
// Étape N — qui a lu quoi. Renseigné pour NOS messages uniquement :
// l'hôte ne rejoue que ceux-là, et c'est l'expéditeur que ça intéresse.
const lectures = {};     // messageId -> [{ personId, sender, ts }]
// Messages dont on a déjà accusé réception, pour ne pas renvoyer
// indéfiniment le même accusé à chaque nouveau rendu du fil.
const dejaAccuses = new Set();
// Étape H — dépouillements par vote : ils n'arrivent PAS avec les
// messages, l'hôte les rediffuse à chaque réponse.
const voteTallies = {};
// Étape G — message auquel on répond (identifiant seul : le cité est
// relu dans le fil, pour ne pas afficher un fantôme après purge).
let replyToId = null;

// Même règle que chat-module/src/direct.js : empreintes TRIÉES, sinon les
// deux côtés ouvriraient deux fils distincts pour la même paire.
const threadIdFor = (a, b) => "dm:" + [String(a).toLowerCase(), String(b).toLowerCase()].sort().join("+");

const humanSize = (n) => n < 1024 * 1024
  ? Math.max(1, Math.round(n / 1024)) + " Ko"
  : (n / 1024 / 1024).toFixed(1) + " Mo";

// ── Pièce jointe : la vignette est DANS le message (affichage immédiat),
// le fichier complet n'est demandé qu'au clic. Voir src/media.js.
const pendingMedia = new Map(); // sha256 -> { chunks, resolve, reject }

function fetchMedia(sha256, mime) {
  return new Promise((resolve, reject) => {
    if (!ws || ws.readyState !== 1) { reject(new Error("offline")); return; }
    // Un seul téléchargement en vol par fichier : deux clics rapides ne
    // doivent pas ouvrir deux flux concurrents pour les mêmes octets.
    const enCours = pendingMedia.get(sha256);
    if (enCours) { enCours.waiters.push({ resolve, reject }); return; }
    pendingMedia.set(sha256, { chunks: [], waiters: [{ resolve, reject }] });
    ws.send(encryptPayload(key, { v: 1, type: "media-get", sha256, mime }));
  });
}

function renderMedia(div, m) {
  const md = m.media;
  if (!md) return;
  if (md.kind === "image" && md.thumb) {
    const img = document.createElement("img");
    img.className = "thumb"; img.src = md.thumb; img.alt = "";
    img.onclick = async () => {
      try {
        const buf = await fetchMedia(md.sha256, md.mime);
        const url = URL.createObjectURL(new Blob([buf], { type: md.mime }));
        window.open(url, "_blank");
      } catch { img.insertAdjacentText("afterend", t("attFailed")); }
    };
    div.appendChild(img);
    return;
  }
  const box = document.createElement("div"); box.className = "att";
  const ico = document.createElement("span"); ico.className = "ico";
  ico.textContent = md.kind === "voice" ? "🎤" : "📄";
  const meta = document.createElement("div"); meta.className = "meta";
  const titre = document.createElement("span");
  titre.textContent = md.kind === "voice" ? t("attVoice") : (md.name || t("attFile"));
  const sub = document.createElement("small");
  sub.textContent = md.kind === "voice" && md.duration
    ? Math.floor(md.duration / 60) + ":" + String(md.duration % 60).padStart(2, "0")
    : humanSize(md.size || 0);
  meta.append(titre, sub);
  const btn = document.createElement("button"); btn.textContent = t("attSave");
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = t("attLoading");
    try {
      const buf = await fetchMedia(md.sha256, md.mime);
      const url = URL.createObjectURL(new Blob([buf], { type: md.mime }));
      if (md.kind === "voice") {
        // Lecteur en place : sur téléphone, ouvrir un onglet pour un
        // vocal de trois secondes serait absurde.
        const audio = document.createElement("audio");
        audio.controls = true; audio.src = url;
        box.replaceWith(audio);
      } else {
        const a = document.createElement("a");
        a.href = url; a.download = md.name || "hnaya-fichier";
        document.body.appendChild(a); a.click(); a.remove();
        btn.disabled = false; btn.textContent = t("attSave");
      }
    } catch (e) {
      btn.disabled = false;
      btn.textContent = e && e.message === "gone" ? t("attGone") : t("attFailed");
    }
  };
  box.append(ico, meta, btn);
  div.appendChild(box);
}

// ── Étape H — carte de vote ────────────────────────────────────────
// Mêmes règles que sur le poste : le décompte et les noms sont portés
// par la demande elle-même, et « en attente » dit ce qu'une citation ne
// pourra jamais dire. En mode non nominatif, aucun nom n'est diffusé —
// l'hôte ne l'envoie tout simplement pas.
function voteNode(m) {
  const def = m.extra || {};
  const options = def.options || [];
  const nominatif = def.nominatif !== false;
  const dep = voteTallies[m.id] || { decompte: {}, total: 0, voters: [], detail: [] };
  const jaiRepondu = myFp && dep.voters.some((v) => v.fingerprint === myFp);

  const box = document.createElement("div");
  box.className = "vote";

  const ent = document.createElement("div"); ent.className = "vote-head";
  ent.textContent = t("voteLabel");
  if (!nominatif) {
    const tag = document.createElement("span"); tag.className = "vote-tag";
    tag.textContent = t("voteNotNamed"); ent.appendChild(tag);
  }
  box.appendChild(ent);

  const q = document.createElement("div"); q.className = "vote-q"; q.textContent = m.text || "";
  box.appendChild(q);

  options.forEach((opt, i) => {
    const n = dep.decompte[i] || 0;
    const b = document.createElement("button");
    b.className = "vote-opt";
    // Le bulletin non nominatif est definitif : on desactive plutot que
    // de laisser cliquer pour un refus de l'hote.
    b.disabled = !!(jaiRepondu && !nominatif);
    const lib = document.createElement("span"); lib.textContent = opt; lib.style.flex = "1";
    const cpt = document.createElement("span"); cpt.textContent = String(n); cpt.className = "vote-n";
    b.append(lib, cpt);
    b.onclick = () => repondreVote(m.id, i, "");
    box.appendChild(b);
    if (nominatif) {
      const qui = dep.detail.filter((d) => d.choice === i);
      if (qui.length) {
        const l = document.createElement("div"); l.className = "vote-who";
        l.textContent = qui.map((d) => d.sender + (d.comment ? " (" + d.comment + ")" : "")).join(", ");
        box.appendChild(l);
      }
    }
  });

  const pied = document.createElement("div"); pied.className = "vote-foot";
  const attendus = people.length ? people.length - dep.voters.length : 0;
  pied.textContent = dep.voters.length + " " + t("voteAnswered")
    + (attendus > 0 ? " · " + attendus + " " + t("votePending") : "");
  box.appendChild(pied);
  if (jaiRepondu && !nominatif) {
    const f = document.createElement("div"); f.className = "vote-foot";
    f.textContent = t("voteFinal"); box.appendChild(f);
  }
  return box;
}

// ── Étape K — demande qualifiée sur la page mobile ────────────────────
// Un directeur valide souvent depuis son téléphone : la lecture ET la
// décision doivent être possibles ici, pas seulement sur le poste.
//
// ⚠️ Une issue ne s'affiche JAMAIS sans le nom de qui l'a prise. Un
// « Validé » anonyme dans un circuit d'approbation donne une certitude que
// rien ne fonde — c'est l'exigence qui a motivé toute la fonction.
const TAG_TON = { info: "#8a8a8a", avis: "#4a9eff", validation: "#00c853", approbation: "#ffa726" };
const ISSUE_TON = { valide: "#00c853", refuse: "#ff5252", reserve: "#ffa726" };
const decisions = {};   // messageId -> [décisions]

function demandeNode(m) {
  const ton = TAG_TON[m.tag] || "#8a8a8a";
  const box = document.createElement("div");
  box.className = "demande";
  box.style.borderColor = ton + "88";
  box.style.background = ton + "18";

  const tete = document.createElement("div");
  tete.className = "demande-tete";
  tete.style.color = ton;
  tete.textContent = t("tag_" + m.tag);
  if (m.destinataire) {
    const p = people.find((x) => x.fingerprint === m.destinataire);
    const moi = m.destinataire === myFp;
    const vers = document.createElement("span");
    vers.className = "demande-vers";
    vers.textContent = " → " + (moi ? t("demandeYou") : (p?.name || m.destinataire.slice(0, 8)));
    tete.appendChild(vers);
  }
  box.appendChild(tete);

  const prises = decisions[m.id] || [];
  for (const d of prises) {
    const l = document.createElement("div");
    l.className = "demande-issue";
    const badge = document.createElement("b");
    badge.style.color = ISSUE_TON[d.issue] || "#8a8a8a";
    badge.textContent = t("issue_" + d.issue);
    l.appendChild(badge);
    l.appendChild(document.createTextNode(
      " — " + (d.sender || "?") + " · " + new Date(d.ts).toLocaleString()));
    if (d.comment) {
      const c = document.createElement("div");
      c.className = "demande-com";
      c.textContent = "« " + d.comment + " »";
      l.appendChild(c);
    }
    box.appendChild(l);
  }

  if (m.tag !== "info" && !prises.length) {
    const att = document.createElement("div");
    att.className = "demande-att";
    att.textContent = t("demandePending");
    box.appendChild(att);
  }

  // Boutons : le destinataire désigné s'il y en a un, sinon tout le monde.
  // Même règle que l'hôte — la dupliquer n'autorise rien, elle évite
  // d'afficher des boutons qui seraient refusés.
  const peutDecider = m.tag !== "info" && (!m.destinataire || m.destinataire === myFp);
  if (peutDecider) {
    const mienne = prises.find((d) => d.fingerprint === myFp);
    const rangee = document.createElement("div");
    rangee.className = "demande-actions";
    for (const issue of ["valide", "refuse", "reserve"]) {
      const b = document.createElement("button");
      b.textContent = t("issue_" + issue);
      if (mienne && mienne.issue === issue) {
        b.style.borderColor = ISSUE_TON[issue];
        b.style.color = ISSUE_TON[issue];
        b.style.background = ISSUE_TON[issue] + "28";
      }
      b.onclick = () => envoyerDecision(m.id, issue);
      rangee.appendChild(b);
    }
    box.appendChild(rangee);
  }
  return box;
}

// ── Étape K — état du sélecteur d'étiquette ───────────────────────────
let tagChoisi = null, destinataireChoisi = "";

function choisirTag(t2) {
  tagChoisi = t2;
  destinataireChoisi = t2 && t2 !== "info" ? destinataireChoisi : "";
  for (const b of document.querySelectorAll(".tag-choix button")) {
    const actif = b.dataset.tag === t2;
    const ton = TAG_TON[b.dataset.tag];
    b.style.borderColor = actif ? ton : "var(--border)";
    b.style.color = actif ? ton : "var(--muted)";
    b.style.background = actif ? ton + "28" : "transparent";
  }
  // Désigner quelqu'un n'a de sens que si l'on attend une réponse : un
  // « pour info » adressé nommément laisserait croire qu'il faut agir.
  const sel = document.getElementById("tagDest");
  sel.hidden = !t2 || t2 === "info";
  if (!sel.hidden) remplirDestinataires();
}

function remplirDestinataires() {
  const sel = document.getElementById("tagDest");
  const garde = sel.value;
  sel.textContent = "";
  const aucun = document.createElement("option");
  aucun.value = ""; aucun.textContent = t("demandeAnyone");
  sel.appendChild(aucun);
  for (const p of people) {
    if (p.fingerprint === myFp) continue;
    const o = document.createElement("option");
    o.value = p.fingerprint;
    o.textContent = (p.name || p.fingerprint.slice(0, 8)) + (p.role ? " · " + p.role : "");
    sel.appendChild(o);
  }
  sel.value = garde;
  destinataireChoisi = sel.value;
}

for (const b of document.querySelectorAll(".tag-choix button")) {
  b.onclick = () => choisirTag(tagChoisi === b.dataset.tag ? null : b.dataset.tag);
}
document.getElementById("tagDest").onchange = (e) => { destinataireChoisi = e.target.value; };

function envoyerDecision(messageId, issue) {
  if (!identity) return;
  const core = {
    id: "dec_" + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
    from: userId, text: "", ts: Date.now(),
    demandeSha: decisionSeal(messageId, issue),
  };
  ws.send(encryptPayload(key, {
    v: 2, type: "decision", id: core.id, messageId, issue,
    comment: "", ts: core.ts, signature: identity.signMessage(core),
  }));
}

// ── Étape N — accuser réception de ce qu'on a SOUS LES YEUX ───────────
// Un message compté « lu » alors que l'annuaire recouvre le fil, ou que la
// page est en arrière-plan, ferait mentir l'accusé — et c'est sa seule
// valeur. On n'accuse donc que ce qui est réellement affiché.
function accuserSiVisible(m) {
  if (!m.id || m.from === userId) return;
  if (dejaAccuses.has(m.id)) return;
  if (document.hidden) return;
  if (rosterEl.classList.contains("show")) return;
  if (!ws || ws.readyState !== 1) return;
  dejaAccuses.add(m.id);
  ws.send(encryptPayload(key, { v: 1, type: "read", messageId: m.id, groupId: m.groupId || "all" }));
}

// « Vu par », sous SES PROPRES messages seulement : c'est l'expéditeur qui
// se demande si on l'a lu. Sous ceux des autres, ce serait de la
// surveillance de qui lit quoi.
function lecturesNode(m) {
  const l = lectures[m.id];
  if (!l || !l.length) return null;
  const d = document.createElement("div");
  d.className = "vu";
  d.textContent = t("seenBy") + " " + l.map((r) => r.sender || "?").join(", ");
  d.title = l.map((r) => (r.sender || "?") + " · " + new Date(r.ts).toLocaleString()).join("\n");
  return d;
}

// ── Étape P — réunion annoncée ────────────────────────────────
// ⚠️ Le mobile ne peut PAS notifier : pas de service worker, donc pas de
// contexte sécurisé (page servie en http sur une IP privée) — la même
// cause que l'absence de microphone. La page doit rester ouverte. On
// affiche donc ce qu'on peut : la carte et son compte à rebours.
function resteAvant(debut, dureeMin) {
  const n = Date.now();
  if (n >= debut) return n < debut + dureeMin * 60000 ? t("meetingNow") : t("meetingOver");
  const min = Math.ceil((debut - n) / 60000);
  if (min < 60) return t("meetingIn") + " " + min + " min";
  const h = Math.floor(min / 60), r = min % 60;
  if (h < 24) return t("meetingIn") + " " + h + " h" + (r ? " " + r : "");
  return t("meetingIn") + " " + Math.floor(h / 24) + " j";
}

// Échappement iCalendar : virgule, point-virgule et contre-oblique sont
// des séparateurs du format. Doit rester identique à context/ics.ts.
function echapperIcs(s) {
  return String(s ?? "").replace(/\\/g, "\\\\").replace(/;/g, "\\;")
    .replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}

function horodatageUtc(ms) {
  const d = new Date(ms), p = (n) => String(n).padStart(2, "0");
  return d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate())
    + "T" + p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds()) + "Z";
}

function telechargerIcs(m) {
  const e = m.extra || {};
  const fin = Number(e.startsAt) + Math.max(1, Number(e.durationMin) || 60) * 60000;
  const lignes = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Hnaya DZ//Messagerie locale//FR",
    "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "BEGIN:VEVENT",
    "UID:" + echapperIcs(m.id) + "@hnaya.dz",
    "DTSTAMP:" + horodatageUtc(Date.now()),
    "DTSTART:" + horodatageUtc(Number(e.startsAt)),
    "DTEND:" + horodatageUtc(fin),
    "SUMMARY:" + echapperIcs(e.title),
  ];
  if (e.location) lignes.push("LOCATION:" + echapperIcs(e.location));
  if (m.text) lignes.push("DESCRIPTION:" + echapperIcs(m.text));
  // Rappel à quinze minutes, aligné sur celui de la messagerie : sans
  // VALARM, l'agenda applique son propre défaut (trente minutes sur le
  // téléphone testé) et l'on reçoit deux rappels décalés sans savoir
  // lequel vient d'où. Doit rester identique à context/ics.ts.
  lignes.push("BEGIN:VALARM", "TRIGGER:-PT15M", "ACTION:DISPLAY",
              "DESCRIPTION:" + echapperIcs(e.title), "END:VALARM");
  lignes.push("END:VEVENT", "END:VCALENDAR");
  // CRLF exigé par la RFC : Outlook rejette un fichier en LF seuls.
  const blob = new Blob([lignes.join("\r\n") + "\r\n"], { type: "text/calendar" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = String(e.title || "reunion").replace(/[\\/:*?"<>|]/g, "-").slice(0, 60) + ".ics";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function meetingNode(m) {
  const e = m.extra || {};
  const debut = Number(e.startsAt) || 0;
  const duree = Number(e.durationMin) || 60;
  const imminent = debut - Date.now() < 15 * 60000 && Date.now() < debut + duree * 60000;
  const box = document.createElement("div");
  box.className = "reunion" + (imminent ? " proche" : "");
  box.dataset.id = m.id || "";

  const tete = document.createElement("div"); tete.className = "reunion-tete";
  const titre = document.createElement("b"); titre.textContent = e.title || "";
  const compte = document.createElement("span");
  compte.className = "reunion-compte";
  compte.textContent = resteAvant(debut, duree);
  tete.append("📅 ", titre, compte);
  box.appendChild(tete);

  const quand = document.createElement("div"); quand.className = "reunion-quand";
  quand.textContent = new Date(debut).toLocaleString() + " · " + duree + " min"
    + (e.location ? " · " + e.location : "");
  box.appendChild(quand);

  if (m.text) {
    const txt = document.createElement("div"); txt.className = "reunion-txt";
    txt.textContent = m.text;
    box.appendChild(txt);
  }

  const bas = document.createElement("div"); bas.className = "reunion-bas";
  const par = document.createElement("span");
  par.textContent = t("meetingBy") + " " + (m.from || "");
  const b = document.createElement("button");
  b.textContent = "⤓ " + t("meetingExport");
  b.onclick = () => telechargerIcs(m);
  bas.append(par, b);
  box.appendChild(bas);
  return box;
}

function messageNode(m) {
  if (m.type === "vote") return voteNode(m);
  if (m.type === "meeting") return meetingNode(m);
  const div = document.createElement("div");
  div.className = "msg" + (m.from === userId ? " mine" : "");
  const from = document.createElement("div"); from.className = "from"; from.textContent = m.from || "";
  div.appendChild(from);
  // Étape G — message cité : relu dans le fil plutôt que recopié, pour
  // qu'une purge de rétention ne laisse pas un fantôme à l'écran.
  if (m.replyTo) {
    const cite = allMessages.find((x) => x.id === m.replyTo);
    const bloc = document.createElement("div"); bloc.className = "quote";
    const qui = document.createElement("div"); qui.className = "quote-who";
    qui.textContent = cite ? (cite.from || "") : t("replyGone");
    bloc.appendChild(qui);
    if (cite) {
      const txt = document.createElement("div"); txt.className = "quote-txt";
      txt.textContent = cite.text || (cite.media ? t("attAttachment") : "");
      bloc.appendChild(txt);
      bloc.onclick = () => {
        const n = messagesEl.querySelector('[data-id="' + cite.id + '"]');
        if (n) n.scrollIntoView({ block: "center", behavior: "smooth" });
      };
    }
    div.appendChild(bloc);
  }
  div.dataset.id = m.id || "";
  accuserSiVisible(m);
  // Étape K — demande qualifiée : nature de l'envoi, personne désignée,
  // issues prises. Placé AVANT le texte : on doit savoir ce qu'on attend
  // de nous avant de lire.
  if (m.tag) div.appendChild(demandeNode(m));
  // Texte facultatif : un vocal ou une image peut partir sans un mot.
  if (m.text) { const text = document.createElement("div"); renderText(text, m.text); div.appendChild(text); }
  renderMedia(div, m);
  // Répondre : toujours visible, jamais au seul survol — un téléphone n'a
  // pas de survol, et une action invisible n'existe pas.
  const rep = document.createElement("button");
  rep.className = "reply-btn"; rep.type = "button";
  rep.textContent = t("reply");
  rep.setAttribute("aria-label", t("reply"));
  rep.onclick = () => setReplyTo(m.id);
  div.appendChild(rep);
  const time = document.createElement("div"); time.className = "time";
  time.textContent = m.ts ? new Date(m.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
  div.appendChild(time);
  if (m.from === userId) {
    const vu = lecturesNode(m);
    if (vu) div.appendChild(vu);
  }
  return div;
}

function renderMessages() {
  messagesEl.textContent = "";
  const duFil = allMessages.filter((m) => (m.groupId || "all") === activeThread);
  if (!duFil.length) {
    // ⚠️ Le salon principal n'affichait RIEN : littéralement une chaîne
    // vide. En paysage la zone est courte et cela passe ; en portrait
    // c'est un écran entier de vide, et la page paraît cassée. Constaté
    // en test réel. L'état vide est désormais centré et explicite.
    const vide = document.createElement("div");
    vide.className = "empty";
    const titre = document.createElement("div"); titre.className = "empty-t";
    titre.textContent = activeThread === "all" ? t("roomEmpty") : t("threadEmpty");
    vide.appendChild(titre);
    if (activeThread === "all") {
      const aide = document.createElement("div"); aide.className = "empty-s";
      aide.textContent = t("roomEmptyHint");
      vide.appendChild(aide);
    }
    messagesEl.appendChild(vide);
    return;
  }
  duFil.forEach((m) => messagesEl.appendChild(messageNode(m)));
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// `duBacklog` : message rattrapé, pas message vif. Il compte comme non lu
// (il l'est), mais il ne sonne pas — sinon rejoindre après une absence
// déclencherait un signal par message manqué.
function addMessage(m, duBacklog) {
  if (m.id && seenIds.has(m.id)) return;
  if (m.id) seenIds.add(m.id);
  if (m.ts) lastSeenTs = Math.max(lastSeenTs, m.ts);
  allMessages.push(m);
  const fil = m.groupId || "all";
  if (fil !== activeThread && fil.startsWith("dm:") && m.from !== userId) {
    unread[fil] = (unread[fil] || 0) + 1;
    renderBadge();
  }
  // Signal sonore : rien pour nos propres messages, ni pour un fil qu'on a
  // sous les yeux et page au premier plan.
  const auRegard = fil === activeThread && !document.hidden;
  if (!duBacklog && m.from !== userId && !auRegard) {
    jouerSon(fil.startsWith("dm:") ? "private" : "room");
  }
  if (fil === activeThread) {
    // Rendu incrémental : reconstruire tout le fil à chaque message
    // ferait sauter le défilement en pleine lecture.
    if (messagesEl.firstChild && !messagesEl.querySelector(".msg")) messagesEl.textContent = "";
    messagesEl.appendChild(messageNode(m));
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

function renderBadge() {
  const total = Object.values(unread).reduce((a, b) => a + b, 0);
  rosterBadge.className = total ? "badge" : "";
  rosterBadge.textContent = total ? String(total) : "";
  renderPrive();
}

// ── Étape J — messages privés en attente ──────────────────────
// Le compte sur l'icône 👥 ne suffisait pas : sur un téléphone il fait
// quelques pixels, dans l'en-tête, loin du regard. Le bandeau nomme
// l'expéditeur et ouvre sa conversation d'un appui.
function renderPrive() {
  const bar = document.getElementById("priveBar");
  const attente = Object.entries(unread)
    .filter(([fil, n]) => n > 0 && fil !== activeThread);
  if (!attente.length) { bar.hidden = true; bar.textContent = ""; return; }
  bar.textContent = "";
  for (const [fil, n] of attente) {
    // Le nom est relu dans le fil : un pseudo changé s'affiche à jour, et
    // il n'y a pas un second état à tenir cohérent.
    let de = t("rosterUnnamed");
    for (let i = allMessages.length - 1; i >= 0; i--) {
      const m = allMessages[i];
      if ((m.groupId || "all") === fil && m.from !== userId) { de = m.from; break; }
    }
    const b = document.createElement("button");
    const qui = document.createElement("span");
    qui.className = "qui";
    const fort = document.createElement("b"); fort.textContent = de;
    qui.appendChild(fort);
    qui.appendChild(document.createTextNode(" — " + t("priveWaiting")));
    const compte = document.createElement("span");
    compte.className = "n"; compte.textContent = String(n);
    b.appendChild(document.createTextNode("✉ "));
    b.appendChild(qui); b.appendChild(compte);
    b.onclick = () => {
      // ⚠️ L'identifiant du fil contient les DEUX empreintes, la nôtre
      // comprise : chercher la première qui y figure retombait sur
      // nous-même, et le bandeau du fil affichait notre propre nom en face
      // de « Privé ». On exclut explicitement notre empreinte.
      const mien = (myFp || "").toLowerCase();
      const p = people.find((x) => x.fingerprint
        && x.fingerprint.toLowerCase() !== mien
        && fil.includes(x.fingerprint.toLowerCase()));
      openThread(fil, p || { name: de, role: null, fingerprint: null });
    };
    bar.appendChild(b);
  }
  bar.hidden = false;
}

// ── Étape J — signal sonore ───────────────────────────────────
// Synthétisé, comme sur le poste : aucun fichier à servir depuis l'hôte,
// donc rien de plus à télécharger sur un téléphone en wifi d'entreprise.
// Deux timbres : le privé monte et dure plus longtemps que le salon.
const CLE_SON = "hnaya-mobile-son";
let audioCtx = null;
const sonActif = () => localStorage.getItem(CLE_SON) !== "0";

function ctxAudio() {
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;
  if (!audioCtx) { try { audioCtx = new Ctor(); } catch { return null; } }
  // ⚠️ Indispensable sur mobile : le contexte naît suspendu et ne se
  // débloque que dans un geste utilisateur. Sans ce resume, la page
  // restait muette toute la session sans le moindre message d'erreur.
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  return audioCtx;
}

function note(ac, freq, depart, duree, gain) {
  const osc = ac.createOscillator(), vol = ac.createGain();
  osc.type = "sine"; osc.frequency.value = freq;
  const t0 = ac.currentTime + depart;
  vol.gain.setValueAtTime(0.0001, t0);
  vol.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  vol.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
  osc.connect(vol).connect(ac.destination);
  osc.start(t0); osc.stop(t0 + duree + 0.02);
}

function jouerSon(genre) {
  if (!sonActif()) return;
  const ac = ctxAudio();
  if (!ac) return;
  try {
    if (genre === "private") { note(ac, 660, 0, 0.16, 0.16); note(ac, 990, 0.13, 0.26, 0.16); }
    else note(ac, 620, 0, 0.14, 0.09);
  } catch { /* contexte fermé */ }
}

function majBoutonSon() {
  const b = document.getElementById("sonBtn");
  const actif = sonActif();
  document.getElementById("sonIcone").textContent = actif ? "🔔" : "🔕";
  b.setAttribute("aria-label", t(actif ? "soundOn" : "soundOff"));
  b.title = t(actif ? "soundOn" : "soundOff");
}

document.getElementById("sonBtn").onclick = () => {
  const suivant = !sonActif();
  localStorage.setItem(CLE_SON, suivant ? "1" : "0");
  majBoutonSon();
  // Allumer joue le son : on entend ce qu'on vient d'activer, et l'appui
  // sert de geste utilisateur pour débloquer l'audio du téléphone.
  if (suivant) jouerSon("private");
};

// ── Annuaire ──────────────────────────────────────────────────
const depuis = (ts) => {
  if (!ts) return "";
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return t("rosterJustNow");
  if (min < 60) return min + " min";
  const h = Math.floor(min / 60);
  return h < 24 ? h + " h" : Math.floor(h / 24) + " j";
};

// ── Étape M — pastille d'identité ─────────────────────────────
// Pas de fichier : ni image générique livrée avec la page, ni silhouette
// grise identique pour tous, qui ne distingue personne. Des initiales sur
// une couleur DÉRIVÉE de l'identifiant de la personne — toujours
// disponible, stable d'une session à l'autre, et distinctive.
//
// ⚠️ La couleur vient de l'identifiant de PERSONNE, jamais du pseudo :
// corriger une faute dans son nom ne doit pas changer sa couleur, sinon
// le repère visuel ne vaut rien. Mêmes formules que ChatAvatar.tsx côté
// poste, pour que la même personne ait la même couleur partout.
// ⚠️ PALETTE DISCRÈTE : une teinte calculée librement sur 360° donnait,
// sur quatre personnes réelles, trois turquoises presque identiques —
// indistinguables d'un coup d'œil. Deux couleurs IDENTIQUES gênent moins
// que deux couleurs PRESQUE identiques. Douze teintes écartées d'au moins
// 25°, deux clartés : 24 pastilles nettement séparées.
// Doit rester rigoureusement identique à ChatAvatar.tsx côté poste.
const TEINTES = [0, 30, 60, 95, 130, 160, 190, 215, 245, 275, 305, 335];
const CLARTES = [38, 29];

function couleurDePersonne(id) {
  const s = String(id || "");
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  const n = Math.abs(h);
  return "hsl(" + TEINTES[n % TEINTES.length] + " 45% " + CLARTES[(n >>> 8) % CLARTES.length] + "%)";
}

function initialesDe(nom) {
  const mots = String(nom || "").trim().split(/\s+/).filter(Boolean);
  if (!mots.length) return "?";
  if (mots.length === 1) return mots[0].slice(0, 2).toUpperCase();
  return (mots[0][0] + mots[1][0]).toUpperCase();
}

// Photos déjà téléchargées : une empreinte, une URL. Rien à invalider —
// une photo remplacée a une autre empreinte.
const photosCache = new Map();

function avatarNode(p) {
  const box = document.createElement("span");
  box.className = "avatar" + (p.online ? " on" : "");
  box.style.background = couleurDePersonne(p.personId || p.fingerprint);
  box.textContent = initialesDe(p.name);
  if (!p.avatarSha) return box;
  // Les initiales restent affichées tant que la photo n'est pas là :
  // jamais de trou pendant le téléchargement.
  const poser = (url) => {
    if (!url) return;
    const img = document.createElement("img");
    img.src = url; img.alt = "";
    img.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:50%";
    box.textContent = ""; box.style.background = "transparent"; box.appendChild(img);
  };
  if (photosCache.has(p.avatarSha)) poser(photosCache.get(p.avatarSha));
  else {
    fetchMedia(p.avatarSha, "image/jpeg").then((octets) => {
      if (!octets) return;
      const url = URL.createObjectURL(new Blob([octets], { type: "image/jpeg" }));
      photosCache.set(p.avatarSha, url);
      poser(url);
    }).catch(() => { /* on garde les initiales */ });
  }
  return box;
}

// ── Étape M — déposer sa propre photo ─────────────────────────────
// Le fichier choisi ne part JAMAIS tel quel : recadré au carré central,
// ramené à 128 px et réencodé en JPEG. On ne sert que des octets qu'on a
// fabriqués — ni métadonnées EXIF (souvent la position GPS de la prise de
// vue), ni charge cachée dans un format mal formé.
const TAILLE_AVATAR = 128;

function preparerPhoto(fichier) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("lecture"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("image"));
      img.onload = () => {
        const cote = Math.min(img.width, img.height);
        const cnv = document.createElement("canvas");
        cnv.width = TAILLE_AVATAR; cnv.height = TAILLE_AVATAR;
        const ctx = cnv.getContext("2d");
        if (!ctx) { reject(new Error("canvas")); return; }
        ctx.drawImage(img, (img.width - cote) / 2, (img.height - cote) / 2, cote, cote,
                      0, 0, TAILLE_AVATAR, TAILLE_AVATAR);
        cnv.toBlob((blob) => {
          if (!blob) { reject(new Error("encodage")); return; }
          blob.arrayBuffer().then((ab) => resolve(new Uint8Array(ab))).catch(reject);
        }, "image/jpeg", 0.85);
      };
      img.src = String(fr.result);
    };
    fr.readAsDataURL(fichier);
  });
}

document.getElementById("photoInput").onchange = (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = ""; // permet de rechoisir le même fichier
  if (f) deposerPhoto(f);
};

async function deposerPhoto(fichier) {
  try {
    const bytes = await preparerPhoto(fichier);
    const res = await televerser({ kind: "image", mime: "image/jpeg", bytes, thumb: null });
    ws.send(encryptPayload(key, { v: 1, type: "set-avatar", sha256: res.sha256 }));
    setTimeout(requestRoster, 400);
  } catch {
    showAttError(t("avatarFailed"));
  }
}

function renderRoster() {
  rosterEl.textContent = "";
  const tri = [...people].sort((a, b) => {
    if (a.isMe !== b.isMe) return a.isMe ? 1 : -1;
    if (a.online !== b.online) return a.online ? -1 : 1;
    return (a.name || "").localeCompare(b.name || "");
  });
  // Étape M — sa propre photo, en tête de l'annuaire : c'est en regardant
  // les visages qu'on pense au sien.

  barre.className = "ma-photo";

  bp.textContent = "📷 " + t("avatarChange");
  bp.onclick = () => document.getElementById("photoInput").click();
  barre.appendChild(bp);
  if (people.find((x) => x.isMe && x.avatarSha)) {
    const br = document.createElement("button");
    br.className = "lien";
    br.textContent = t("avatarRemove");
    br.onclick = () => {
      ws.send(encryptPayload(key, { v: 1, type: "set-avatar", sha256: null }));
      setTimeout(requestRoster, 400);
    };

  }
  rosterEl.appendChild(barre);

  if (!tri.length) {

    vide.textContent = t("rosterEmpty");
    rosterEl.appendChild(vide);
    return;
  }
  tri.forEach((p) => {
    const b = document.createElement("button");
    b.className = "person";
    // Étape M — l'avatar porte la présence : deux ronds côte à côte se
    // disputaient le regard sans qu'on sache lequel lire.
    const dot = avatarNode(p);
    const who = document.createElement("span"); who.className = "who";
    const nom = document.createElement("b");
    nom.textContent = (p.name || t("rosterUnnamed")) + (p.isMe ? " · " + t("rosterMe") : "");
    const sous = document.createElement("span");
    if (p.role) { sous.className = "role"; sous.textContent = p.role; }
    else sous.textContent = p.online ? t("rosterOnline") : depuis(p.lastSeen);
    who.append(nom, sous);
    b.append(dot, who);
    const fil = myFp && !p.isMe ? threadIdFor(myFp, p.fingerprint) : null;
    if (fil && unread[fil]) {
      const bg = document.createElement("span"); bg.className = "badge";
      bg.textContent = String(unread[fil]); b.appendChild(bg);
    }
    if (fil) b.onclick = () => openThread(fil, p);
    else b.disabled = true;
    rosterEl.appendChild(b);

}

function openThread(fil, personne) {

  threadTagEl.textContent = t("threadPrivate");

function backToRoom() {

function showRoster(on) {

rosterBtn.onclick = () => showRoster(!rosterEl.classList.contains("show"));
threadBack.onclick = backToRoom;

// ══════════════════════════════════════════════════════════════
// Envoi de pièces jointes (étape E, côté mobile)
// ══════════════════════════════════════════════════════════════
// ⚠️ LE MICROPHONE EST HORS D'ATTEINTE ICI. La page est servie en http://
// sur une IP privée : aucun certificat TLS n'est possible, donc le
// contexte n'est PAS sécurisé et navigator.mediaDevices est indisponible
// (même cause que crypto.subtle, d'où la crypto embarquée). On délègue
// donc l'enregistrement au magnétophone du téléphone via un champ
// fichier `capture` — qui, lui, ne demande aucun contexte sécurisé.
const micSupporte = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

const fileInput = $("fileInput"), audioInput = $("audioInput"),
  attBtn = $("attBtn"), micBtn = $("micBtn"), attPreview = $("attPreview"),
  attThumb = $("attThumb"), attIcon = $("attIcon"), attName = $("attName"),
  attSize = $("attSize"), attCancel = $("attCancel"), attError = $("attError");

let pendingAtt = null;          // pièce jointe préparée, en attente d'envoi
const pendingUploads = new Map(); // uploadId -> { resolve, reject, bytes }

function showAttError(msg) {
  attError.textContent = msg || "";
  attError.classList.toggle("show", !!msg);
}

// Base64 par tranches : String.fromCharCode sur 25 Mo d'un coup ferait
// déborder la pile d'appels.
function toBase64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 8192) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  }
  return btoa(bin);
}

// Une photo de téléphone fait 3 à 8 Mo ; réduite à 1600 px et réencodée
// en JPEG elle tombe sous le mégaoctet, sans différence visible.
const IMG_MAX = 1600, IMG_Q = 0.82, THUMB_MAX = 220, THUMB_Q = 0.6;

function dessiner(img, maxSide, quality) {
  const ratio = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * ratio));
  const h = Math.max(1, Math.round(img.naturalHeight * ratio));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  return { dataUrl: c.toDataURL("image/jpeg", quality), w, h };
}

// L'hôte refuse toute vignette de plus de 24 Ko (MAX_THUMB_BYTES dans
// src/media.js), et elle voyage en base64 — donc gonflée d'un tiers. Une
// photo carrée très détaillée frôle déjà ce plafond : la marge est trop
// mince pour un appareil photo de téléphone, qui produit exactement ce
// genre d'image. On redescend la qualité tant qu'il le faut plutôt que
// de laisser l'envoi entier être refusé.
const THUMB_MAX_OCTETS = 24 * 1024;
function vignetteSousPlafond(img) {
  let out = dessiner(img, THUMB_MAX, THUMB_Q);
  for (const q of [0.45, 0.32, 0.2]) {
    if (out.dataUrl.length <= THUMB_MAX_OCTETS) break;
    out = dessiner(img, THUMB_MAX, q);
  }
  // Dernier recours : réduire aussi les dimensions. Une vignette laide
  // vaut mieux qu'une pièce jointe refusée.
  if (out.dataUrl.length > THUMB_MAX_OCTETS) out = dessiner(img, 140, 0.4);
  return out;
}

function dataUrlEnOctets(dataUrl) {
  const bin = atob(dataUrl.split(",")[1] || "");
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function preparer(file, forcerVocal) {
  if (file.type.startsWith("image/")) {
    const img = await new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const i = new Image();
      i.onload = () => { URL.revokeObjectURL(url); res(i); };
      i.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
      i.src = url;
    });
    const plein = dessiner(img, IMG_MAX, IMG_Q);
    const vignette = vignetteSousPlafond(img);
    const bytes = dataUrlEnOctets(plein.dataUrl);
    return {
      kind: "image", mime: "image/jpeg", bytes, thumb: vignette.dataUrl,
      w: plein.w, h: plein.h, preview: vignette.dataUrl,
      // Le nom doit décrire les octets réellement envoyés : on recompresse
      // toujours en JPEG (voir suggestedFilename dans src/media.js).
      name: file.name.replace(/\.[^.\/\\]{1,8}$/, "") + ".jpg",
    };
  }
  const bytes = new Uint8Array(await file.arrayBuffer());
  const estAudio = forcerVocal || file.type.startsWith("audio/");
  return {
    kind: estAudio ? "voice" : "file",
    mime: file.type || "application/octet-stream",
    bytes, thumb: null, name: file.name || null, preview: null,
  };
}

function afficherApercu(att) {
  if (att.preview) {
    attThumb.src = att.preview; attThumb.style.display = "";
    attIcon.style.display = "none";
  } else {
    attThumb.style.display = "none";
    attIcon.textContent = att.kind === "voice" ? "🎤" : "📄";
    attIcon.style.display = "";
  }
  attName.textContent = att.kind === "voice" ? t("attVoice") : (att.name || t("attFile"));
  attSize.textContent = humanSize(att.bytes.length);
  // Lecteur pour les vocaux, construit sur les octets RETENUS et non sur
  // le fichier d'origine : c'est ce qui partira qu'on doit pouvoir
  // réécouter.
  const audio = document.getElementById("attAudio");
  if (audio.src) { URL.revokeObjectURL(audio.src); audio.removeAttribute("src"); }
  if (att.kind === "voice") {
    audio.src = URL.createObjectURL(new Blob([att.bytes], { type: att.mime || "audio/webm" }));
    audio.hidden = false;
  } else {
    audio.hidden = true;
  }
  attPreview.classList.add("show");
  draft.placeholder = t("attCaption");
}

function annulerApercu() {
  pendingAtt = null;
  // Libérer les octets retenus par l'URL d'objet du lecteur : un vocal
  // refait dix fois dans une même session finirait par peser.
  const audio = document.getElementById("attAudio");
  if (audio && audio.src) { URL.revokeObjectURL(audio.src); audio.removeAttribute("src"); }
  if (audio) audio.hidden = true;
  attPreview.classList.remove("show");
  showAttError("");
  draft.placeholder = t("draftPlaceholder");
}

async function choisir(e, forcerVocal) {
  const file = e.target.files && e.target.files[0];
  e.target.value = ""; // permet de reprendre le même fichier
  if (!file) return;
  showAttError("");
  try {
    pendingAtt = await preparer(file, forcerVocal);
    afficherApercu(pendingAtt);
  } catch (e) {
    // Une image indécodable méritait mieux qu'un « échec » muet : le
    // navigateur déduit le type de l'EXTENSION, pas du contenu, donc une
    // photo HEIC enregistrée « .jpg » est annoncée image/jpeg puis refuse
    // de s'ouvrir. Sans ce message, personne ne peut le deviner.
    showAttError(t(e && e.message === "image" ? "attImageFailed" : "attSendFailed"));
  }
}

attBtn.onclick = () => fileInput.click();
micBtn.onclick = () => audioInput.click();
fileInput.onchange = (e) => choisir(e, false);
audioInput.onchange = (e) => choisir(e, true);
attCancel.onclick = annulerApercu;
document.getElementById("replyCancel").onclick = () => setReplyTo(null);

/** Téléverse chez l'hôte, morceau par morceau, puis rend l'empreinte
 *  CALCULÉE PAR L'HÔTE — c'est elle qui scellera la signature. */
function televerser(att) {
  return new Promise((resolve, reject) => {
    if (!ws || ws.readyState !== 1) { reject(new Error("offline")); return; }
    const b = crypto.getRandomValues(new Uint8Array(8));
    const uploadId = "up_" + Array.from(b).map((x) => x.toString(16).padStart(2, "0")).join("");
    pendingUploads.set(uploadId, { resolve, reject, bytes: att.bytes });
    ws.send(encryptPayload(key, {
      v: 1, type: "media-begin", uploadId,
      kind: att.kind, mime: att.mime, size: att.bytes.length, thumb: att.thumb,
    }));
  });
}

// L'envoi effectif attend le feu vert de l'hôte : inutile d'expédier des
// mégaoctets qu'il refusera (type interdit, quota, taille).
function envoyerMorceaux(uploadId) {
  const en = pendingUploads.get(uploadId);
  if (!en) return;
  const CHUNK = 64 * 1024;
  for (let off = 0, seq = 0; off < en.bytes.length; off += CHUNK, seq++) {
    ws.send(encryptPayload(key, {
      v: 1, type: "media-chunk", uploadId, seq,
      data: toBase64(en.bytes.subarray(off, Math.min(off + CHUNK, en.bytes.length))),
    }));
  }
  ws.send(encryptPayload(key, { v: 1, type: "media-end", uploadId }));
}

const MSG_ERREUR = {
  size: "attTooBig", mime: "attTypeRefused", busy: "attBusy",
  "quota-bytes": "attQuotaBytes", "quota-files": "attQuotaFiles",
};

async function connect() {
  joinError.textContent = "";
  joinBtn.disabled = true; joinBtn.textContent = t("connecting");
  userId = nicknameInput.value.trim();
  localStorage.setItem("hnaya-chat-nickname", userId);
  key = await deriveKeyFromPin(pinInput.value);

  // Le salon se désigne par le chemin (voir src/rooms-host.js). Vide :
  // « / » mène au salon principal — hôte à salon unique compris.
  const chemin = roomIdChoisi ? `/r/${encodeURIComponent(roomIdChoisi)}` : "";
  ws = new WebSocket(`ws://${location.hostname}:${wsPort}${chemin}`);
  let gotBacklog = false;

  // Sans backlog dans les 12 s → échec (PIN silencieusement faux ou réseau) —
  // même garde-fou de délai que le dock des postes
  const timeout = setTimeout(() => { if (!gotBacklog) { try { ws.close(); } catch {} fail(t("cantReach")); } }, 12000);
  const fail = (msg) => {
    clearTimeout(timeout);
    joinBtn.textContent = t("joinBtn"); validate();
    if (!joined) { joinError.textContent = msg; }
    else showStatus(true);
  };

  ws.onopen = () => {
    ws.send(encryptPayload(key, {
      v: 2,
      type: "join",
      userId,
      groups: ["all"],
      lastSeenTs,
      device: {
        publicKey: identity.publicKeySpki,
        hostname: null, // pas de nom de machine exposé par un navigateur
        platform: "mobile-web (" + ((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "?") + ")",
      },
      // Étape L — présenté une seule fois, à la toute première connexion
      // issue du QR. Une reconnexion ultérieure n'en a plus besoin : le
      // rattachement est enregistré chez l'hôte.
      pairing: jetonAppairage || undefined,
    }));
  };
  ws.onmessage = (ev) => {
    let payload;
    try { payload = decryptPayload(key, ev.data); } catch { return; }
    if (payload.type === "backlog") {
      gotBacklog = true; clearTimeout(timeout);
      if (!joined) {
        joined = true;
        joinScreen.classList.remove("active"); chatScreen.classList.add("active");
        rosterBtn.style.display = "flex";
        // Étape J — l'interrupteur du son n'apparaît qu'une fois dans le
        // salon. L'appui sur « Rejoindre » est le geste utilisateur qui
        // autorise l'audio : on amorce le contexte tant qu'il est valide.
        document.getElementById("sonBtn").style.display = "flex";
        majBoutonSon();
        if (sonActif()) ctxAudio();
      }
      showStatus(false);
      payload.messages.forEach((m) => addMessage(m, true));
      renderMessages();
      // L'annuaire donne notre propre empreinte : sans elle, impossible
      // de composer l'identifiant d'un fil privé.
      requestRoster();
    } else if (payload.type === "message") addMessage(payload);
    // Étape H — un vote EST un message du fil ; son dépouillement arrive
    // à part et se rafraîchit à chaque réponse.
    else if (payload.type === "vote") addMessage(payload);
    else if (payload.type === "vote-tally") {
      voteTallies[payload.voteId] = {
        decompte: payload.decompte || {}, total: payload.total || 0,
        voters: payload.voters || [], detail: payload.detail || [],
      };
      renderMessages();
    }
    else if (payload.type === "vote-refused") showAttError(t("voteAlready"));
    // Étape I — échéance de licence. Le bandeau reprend mot pour mot le
    // texte de l'hôte ; passé le délai de grâce, la saisie est coupée
    // plutôt que de laisser écrire un message qui sera refusé.
    else if (payload.type === "licence-notice") appliquerLicence(payload);
    // Étape K — issue d'une demande qualifiée. Comme le dépouillement d'un
    // vote, elle arrive à part du message : l'hôte envoie l'état courant
    // complet, à chaque prise de position et à la connexion.
    else if (payload.type === "decisions") {
      decisions[payload.messageId] = payload.decisions || [];
      renderMessages();
    }
    else if (payload.type === "decision-refused") showAttError(t("demandeNotForYou"));
    // Étape N — qui a lu ce message. Liste complète, pas un incrément.
    else if (payload.type === "reads") {
      lectures[payload.messageId] = payload.reads || [];
      renderMessages();
    }
    else if (payload.type === "presence") {
      presenceEl.textContent = `● ${payload.online.length} ${t("online")}`;
      // La présence a changé : l'annuaire affiché doit suivre, sinon la
      // pastille verte ment jusqu'au prochain aller-retour.
      if (rosterEl.classList.contains("show")) requestRoster();
    }
    // ── Étape F — annuaire ──
    else if (payload.type === "roster") {
      people = payload.people || [];
      myFp = payload.me || myFp;
      renderRoster();
    }
    // ── Étape E — téléversement en cours ──
    else if (payload.type === "media-go") {
      envoyerMorceaux(payload.uploadId);
    } else if (payload.type === "media-ready") {
      const u = pendingUploads.get(payload.uploadId);
      pendingUploads.delete(payload.uploadId);
      if (u) u.resolve({ sha256: payload.sha256, size: payload.size });
    } else if (payload.type === "media-failed") {
      const u = pendingUploads.get(payload.uploadId);
      pendingUploads.delete(payload.uploadId);
      if (u) u.reject(new Error(payload.reason || "media"));
    }
    // ── Étape E — pièces jointes reçues par morceaux ──
    else if (payload.type === "media-data") {
      const p = pendingMedia.get(payload.sha256);
      if (p) p.chunks.push(payload.data);
    } else if (payload.type === "media-done") {
      const p = pendingMedia.get(payload.sha256);
      pendingMedia.delete(payload.sha256);
      if (p) {
        // ⚠️ Décoder CHAQUE morceau séparément, jamais la concaténation
        // des chaînes base64 : un morceau de 64 Kio n'est pas un multiple
        // de 3 octets, son encodage se termine donc par du remplissage
        // « = ». Coller ces chaînes produit un base64 invalide et atob
        // renvoie des octets faux (ou lève).
        const parts = p.chunks.map((b64) => {
          const bin = atob(b64);
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          return arr;
        });
        const total = parts.reduce((n, a) => n + a.length, 0);
        const buf = new Uint8Array(total);
        let off = 0;
        for (const a of parts) { buf.set(a, off); off += a.length; }
        p.waiters.forEach((w) => w.resolve(buf));
      }
    } else if (payload.type === "media-error") {
      const p = pendingMedia.get(payload.sha256);
      pendingMedia.delete(payload.sha256);
      if (p) p.waiters.forEach((w) => w.reject(new Error(payload.reason || "media")));
    }
  };
  ws.onclose = (ev) => {
    // 4001 = l'hôte n'a pas pu déchiffrer notre "join" → PIN incorrect
    if (ev.code === 4001) fail(t("wrongPin"));
    else fail(t("connectionLost"));
    presenceEl.textContent = "";
  };
  ws.onerror = () => { /* onclose suit toujours — géré là-bas */ };
}

joinBtn.onclick = connect;
rejoinBtn.onclick = () => { showStatus(false); connect(); };

// Retour sur la page (téléphone déverrouillé, onglet réactivé) : si la
// connexion est morte pendant la veille, reconnexion automatique — le
// backlog + lastSeenTs récupèrent les messages manqués
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && joined && (!ws || ws.readyState > 1)) connect();
});

// ── Étape H — répondre à un vote depuis le téléphone ──────────────
// La réponse est signée comme un message : c'est ce qui rend une
// validation opposable, quel que soit l'appareil d'où elle part.
function repondreVote(voteId, choice, comment) {
  if (!ws || ws.readyState !== 1) { showAttError(t("attSendFailed")); return; }
  const core = {
    id: "ans_" + genMsgId(), from: userId, text: comment || "", ts: Date.now(),
    voteSha: voteAnswerSeal(voteId, choice),
  };
  ws.send(encryptPayload(key, {
    v: 2, type: "vote-response", id: core.id, voteId, choice,
    comment: core.text, ts: core.ts, signature: identity.signMessage(core),
  }));
}

// Étape G — désigner (ou annuler) le message auquel on répond.
function setReplyTo(id) {
  replyToId = id || null;
  const barre = document.getElementById("replyBar");
  if (!replyToId) { barre.classList.remove("show"); return; }
  const cite = allMessages.find((x) => x.id === replyToId);
  if (!cite) { replyToId = null; barre.classList.remove("show"); return; }
  document.getElementById("replyWho").textContent = t("replyingTo") + " " + (cite.from || "");
  document.getElementById("replyTxt").textContent =
    cite.text || (cite.media ? t("attAttachment") : "");
  barre.classList.add("show");
  try { draft.focus(); } catch { /* champ absent */ }
}

function emettre(text, media) {
  // Protocole v2 : id + horodatage générés ici puis SIGNÉS — même contrat
  // que le client de bureau (src/client.js), vérifié par le serveur.
  const core = { id: genMsgId(), from: userId, text, ts: Date.now() };
  // La pièce jointe entre dans le périmètre signé (5e élément du noyau,
  // voir src/identity.js) : elle ne peut plus être substituée après coup.
  if (media && media.sha256) core.mediaSha = String(media.sha256);
  // Étape G — la citation entre elle aussi dans le périmètre signé : une
  // réponse ne peut pas être déplacée sous une autre demande.
  if (replyToId) core.replyTo = String(replyToId);
  // Étape K — étiquette et destinataire désigné, scellés ensemble au
  // rang 8. Le sceau doit couvrir EXACTEMENT ce que l'hôte recalculera,
  // sinon la signature est rejetée et la demande retombe en simple
  // message : silencieusement, ce qui serait le pire des cas.
  if (tagChoisi) core.demandeSha = demandeSeal(tagChoisi, destinataireChoisi || null);
  ws.send(encryptPayload(key, {
    v: 2,
    type: "message",
    id: core.id,
    text: core.text,
    ts: core.ts,
    replyTo: replyToId || null,
    tag: tagChoisi || null,
    destinataire: destinataireChoisi || null,
    // Le message part dans le fil OUVERT : le salon, ou la conversation
    // privée en cours. Codé en dur, une réponse privée serait partie dans
    // le salon, au vu de tous.
    groupId: activeThread,
    media: media || null,
    signature: identity.signMessage(core),
  }));
  // Remis à zéro après CHAQUE envoi : une étiquette qui colle ferait
  // partir en demande de validation le message anodin qui suit.
  choisirTag(null);
}

async function sendDraft() {
  const text = draft.value.trim();
  // Connexion tombée : le dire. Un retour silencieux laissait l'utilisateur
  // cliquer « Envoyer » sans que rien ne se passe ni ne s'explique.
  if (!ws || ws.readyState !== 1) {
    showStatus(true);
    if (pendingAtt) showAttError(t("connectionLost"));
    return;
  }
  // Un vocal ou une photo peut partir SANS texte — d'où la condition sur
  // l'un ou l'autre.
  if (!text && !pendingAtt) return;

  if (!pendingAtt) { emettre(text, null); draft.value = ""; setReplyTo(null); return; }

  const att = pendingAtt;
  sendBtn.disabled = true;
  const libelle = sendBtn.textContent;
  sendBtn.textContent = t("attSending");
  showAttError("");
  try {
    // Le fichier monte D'ABORD chez l'hôte ; le message ne part qu'ensuite,
    // avec l'empreinte que l'hôte a calculée sur les octets reçus.
    const res = await televerser(att);
    const media = {
      kind: att.kind, mime: att.mime, sha256: res.sha256, size: res.size,
      thumb: att.thumb, name: att.name,
    };
    if (att.kind === "image") { media.w = att.w; media.h = att.h; }
    emettre(text, media);
    draft.value = "";
    setReplyTo(null);
    annulerApercu();
  } catch (e) {
    const cle = MSG_ERREUR[e && e.message] || "attSendFailed";
    showAttError(t(cle));
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = libelle;
  }
}
// Étape I — état de la licence du serveur. Reçu à la connexion, puis à
// chaque changement de palier sans que le téléphone ait à se reconnecter.
function appliquerLicence(p) {
  const bar = document.getElementById("licenceBar");
  const txt = document.getElementById("licenceTxt");
  const stop = !!p.readOnly;
  if (!p.notice) { bar.hidden = true; }
  else {
    txt.textContent = p.notice;
    bar.classList.toggle("stop", stop);
    bar.hidden = false;
  }
  // Couper la saisie plutôt que d'accepter un texte qui sera rejeté.
  for (const id of ["draft", "sendBtn", "attBtn", "micBtn"]) {
    const el = document.getElementById(id);
    if (el) el.disabled = stop;
  }
}

sendBtn.onclick = sendDraft;
draft.addEventListener("keydown", (e) => { if (e.key === "Enter") sendDraft(); });
</script>
